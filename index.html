<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="就活ノート">
<meta name="theme-color" content="#101010">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<title>就活ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#101010; --surface:#1a1e22; --surface-2:#20262c; --card:#191d21;
    --ink:#fffdf9; --ink-soft:#8b9aa8; --ink-faint:#5b6570;
    --border:#33383d; --border-soft:#26292d;
    --accent-red:#ff5c5c; --accent-cyan:#5eb8ff; --accent-lime:#7ee787;
    --good:#7ee787; --danger:#ff5c5c; --info:#5eb8ff;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); font-family:"Noto Sans JP",sans-serif; color:var(--ink); min-height:100vh; -webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:"Noto Sans JP",sans-serif; margin:0 0 .4em 0; font-weight:400; letter-spacing:-0.01em;}
  .app{display:flex; min-height:100vh;}

  /* --- サイドバー：ゴーストナビ --- */
  .sidebar{width:196px; flex-shrink:0; padding:32px 0 28px 22px; display:flex; flex-direction:column; gap:2px; position:relative;}
  .sidebar .brand{color:var(--ink); font-size:18px; font-weight:500; letter-spacing:-0.01em; padding:0 8px 22px 4px; line-height:1.5;}
  .sidebar .updated{color:var(--ink-faint); font-size:10.5px; padding:0 8px 18px 4px; letter-spacing:0.02em;}
  .tab-btn{
    position:relative; text-align:left; border:none; cursor:pointer; padding:12px 16px;
    font-family:"Noto Sans JP",sans-serif; font-size:12.5px; font-weight:500; letter-spacing:0.06em;
    color:var(--ink-soft); background:transparent; border-radius:3px 0 0 3px;
    transition:color .2s ease;
  }
  .tab-btn:hover{color:var(--ink);}
  .tab-btn.active{color:var(--ink); font-weight:700;}
  .tab-indicator{
    position:absolute; left:0; width:3px; border-radius:0 3px 3px 0;
    background:linear-gradient(180deg, var(--accent-red), var(--accent-cyan) 55%, var(--accent-lime));
    transition:top .32s cubic-bezier(.4,0,.2,1), height .32s cubic-bezier(.4,0,.2,1);
    top:0; height:0; opacity:0;
  }

  /* --- メインエリア --- */
  .main{flex:1; background:var(--bg); padding:44px 52px 70px; min-width:0;}
  .main.fade-out{opacity:0; transform:translateY(6px); transition:opacity .12s ease, transform .12s ease;}
  .main.fade-in{animation:fadeSlideUp .38s cubic-bezier(.16,1,.3,1) both;}
  @keyframes fadeSlideUp{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

  .section-head{margin-bottom:30px; position:relative; padding-bottom:18px;}
  .section-head h1{font-size:clamp(30px,4vw,46px); line-height:1.05; color:var(--ink); font-weight:400;}
  .section-head::after{
    content:''; position:absolute; left:0; bottom:0; width:64px; height:3px; border-radius:2px;
    background:linear-gradient(90deg, var(--accent-red), var(--accent-cyan), var(--accent-lime));
  }
  .section-head p{margin:6px 0 0; color:var(--ink-soft); font-size:13px; letter-spacing:0.01em;}

  .card{
    background:var(--card); border:1px solid var(--border-soft); border-radius:10px;
    padding:22px 24px; margin-bottom:16px;
    opacity:0; animation:fadeSlideUp .5s cubic-bezier(.16,1,.3,1) forwards;
    transition:border-color .2s ease, background .2s ease;
  }
  .card:hover{border-color:var(--border);}
  .card h3{font-size:15px; color:var(--ink); font-weight:700; letter-spacing:-0.01em;}
  .card .body{white-space:pre-wrap; font-size:14px; line-height:1.75; margin:0; color:#d8dee3;}
  .muted{color:var(--ink-faint); font-size:13px;}

  table{width:100%; border-collapse:collapse; font-size:13px; background:transparent;}
  thead th{
    text-align:left; padding:11px 12px; background:var(--surface-2); color:var(--ink-soft);
    font-weight:500; letter-spacing:0.03em; cursor:pointer; user-select:none; white-space:nowrap;
    border-bottom:1px solid var(--border); transition:color .15s ease, background .15s ease;
  }
  thead th:hover{color:var(--ink); background:#262c32;}
  thead th .arrow{font-size:10px; margin-left:4px; color:var(--accent-cyan); display:inline-block; transition:transform .2s ease;}
  tbody td{padding:11px 12px; border-bottom:1px solid var(--border-soft); vertical-align:top; white-space:nowrap; color:#dfe4e8;}
  tbody tr{opacity:0; animation:fadeSlideUp .4s cubic-bezier(.16,1,.3,1) forwards; transition:background .15s ease;}
  tbody tr:hover{background:var(--surface);}
  .table-wrap{overflow-x:auto; border:1px solid var(--border-soft); border-radius:10px;}
  .sort-bar{display:flex; gap:10px; margin-bottom:18px; align-items:center; flex-wrap:wrap;}
  .sort-bar select{
    flex:1; max-width:280px; background:var(--surface); border:1px solid var(--border); color:var(--ink);
    border-radius:6px; padding:9px 10px; font-size:13px; font-family:"Noto Sans JP",sans-serif;
  }
  /* --- 企業一覧：カード形式（PC/スマホ共通） --- */
  .co-list{display:flex; flex-direction:column; gap:14px;}
  .co-group-title{font-size:11.5px; font-weight:700; color:var(--accent-lime); letter-spacing:0.06em; margin:6px 0 -2px;}
  .co-card{
    background:var(--card); border:1px solid var(--border-soft); border-radius:12px; padding:18px 20px;
    opacity:0; animation:fadeSlideUp .4s cubic-bezier(.16,1,.3,1) forwards;
  }
  .co-card.co-fav{border-color:rgba(126,231,135,.35); background:rgba(126,231,135,.05);}
  .co-head{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .co-name{font-size:16px; font-weight:700; color:var(--ink);}
  .co-sub{font-size:12.5px; color:var(--ink-soft); margin-top:4px;}
  .co-hl-text{color:var(--accent-lime); font-weight:700;}
  .co-stats{display:grid; grid-template-columns:repeat(auto-fit, minmax(110px,1fr)); gap:8px; margin-top:14px;}
  .co-stat{background:var(--surface); border:1px solid var(--border-soft); border-radius:8px; padding:8px 10px; display:flex; flex-direction:column; gap:2px;}
  .co-stat-v{font-size:15px; font-weight:700; color:var(--ink);}
  .co-stat-l{font-size:10.5px; color:var(--ink-faint);}
  .co-stat.co-hl-box{background:rgba(126,231,135,.14); border-color:rgba(126,231,135,.35);}
  .co-stat.co-hl-box .co-stat-v{color:var(--accent-lime);}
  .co-toggle{
    margin-top:14px; background:transparent; border:1px solid var(--border); color:var(--ink-soft);
    border-radius:6px; padding:7px 14px; font-size:12.5px; cursor:pointer; font-family:"Noto Sans JP",sans-serif;
    transition:all .15s ease;
  }
  .co-toggle:hover{border-color:var(--accent-cyan); color:var(--ink);}
  .co-detail-wrap{margin-top:0;}
  .co-detail{padding-top:14px;}
  .co-detail-row{margin-bottom:12px;}
  .co-detail-row:last-child{margin-bottom:0;}
  .co-detail-label{display:block; font-size:11px; font-weight:700; color:var(--accent-cyan); margin-bottom:4px; letter-spacing:0.03em;}
  .co-detail-row p{margin:0; font-size:13px; color:#c9d1d8; line-height:1.7;}
  .tip-row{padding:12px 0; border-bottom:1px solid var(--border-soft);}
  .tip-row:last-child{border-bottom:none; padding-bottom:0;}
  .tip-title{font-size:14px; font-weight:700; color:var(--accent-lime); margin-bottom:6px;}
  .fb-list{margin:0 0 4px; padding-left:20px;}
  .fb-list li{font-size:13px; color:#c9d1d8; line-height:1.7; margin-bottom:6px;}
  .fb-list.fb-good li::marker{color:var(--accent-lime);}
  .fb-list.fb-bad li::marker{color:var(--accent-red);}
  .fb-list.fb-action li::marker{color:var(--accent-cyan);}
  .score-overall{display:flex; align-items:baseline; gap:4px; margin-bottom:10px;}
  .score-overall-num{font-size:34px; font-weight:700; color:var(--accent-lime); line-height:1;}
  .score-overall-max{font-size:13px; color:var(--ink-faint);}
  .score-chart{display:flex; flex-direction:column; gap:10px;}
  .score-bar-row{display:grid; grid-template-columns:160px 1fr 32px; align-items:center; gap:10px;}
  .score-bar-label{font-size:12px; color:var(--ink-soft);}
  .score-bar-track{background:var(--surface); border-radius:20px; height:10px; overflow:hidden;}
  .score-bar-fill{background:linear-gradient(90deg, var(--accent-cyan), var(--accent-lime)); height:100%; border-radius:20px;}
  .score-bar-value{font-size:13px; font-weight:700; color:var(--ink); text-align:right;}
  .score-history-chart{display:flex; align-items:flex-end; gap:18px; padding-top:20px; min-height:160px;}
  .score-history-col{display:flex; flex-direction:column; align-items:center; gap:6px; flex:1; max-width:90px;}
  .score-history-bar-wrap{width:100%; height:120px; display:flex; align-items:flex-end;}
  .score-history-bar{
    width:100%; background:linear-gradient(180deg, var(--accent-lime), var(--accent-cyan)); border-radius:6px 6px 0 0;
    position:relative; display:flex; justify-content:center; min-height:4px;
  }
  .score-history-num{position:absolute; top:-20px; font-size:12px; font-weight:700; color:var(--accent-lime);}
  .score-history-label{font-size:11px; color:var(--ink-soft); text-align:center; line-height:1.3;}
  .score-history-date{font-size:10px; color:var(--ink-faint);}
  @media (max-width:760px){
    .score-bar-row{grid-template-columns:110px 1fr 28px;}
    .score-bar-label{font-size:11px;}
  }
  /* 企業名列（1列目）を横スクロールしても固定表示 */
  thead th:first-child, tbody td:first-child{
    position:sticky; left:0; z-index:2; background:var(--surface-2); border-right:1px solid var(--border);
  }
  tbody td:first-child{background:var(--card);}
  tbody tr:hover td:first-child{background:var(--surface);}
  /* お気に入り企業 */
  .fav-star{color:var(--accent-lime); margin-right:2px;}
  tbody tr.fav-row td{background:rgba(126,231,135,.05); border-bottom-color:rgba(126,231,135,.2);}
  tbody tr.fav-row td:first-child{background:rgba(126,231,135,.08);}
  tbody tr.fav-row:hover td{background:rgba(126,231,135,.1);}
  tbody tr.fav-row:hover td:first-child{background:rgba(126,231,135,.12);}
  tbody tr.fav-divider-row td{
    background:var(--surface-2); color:var(--accent-lime); font-weight:700; font-size:11.5px;
    letter-spacing:0.06em; padding:8px 12px; border-bottom:1px solid var(--border);
  }
  tbody tr.fav-divider-row:nth-of-type(1) td{color:var(--accent-lime);}
  /* 企業一覧テーブルは全列1行表示、横スクロールで見る（折り返しなし） */
  .company-link{color:var(--ink); font-weight:700; text-decoration:none; border-bottom:1px solid var(--accent-cyan); transition:color .15s ease, border-color .15s ease;}
  td.cell-highlight{background:rgba(126,231,135,.14); color:var(--accent-lime); font-weight:700;}
  .company-link:hover{color:var(--accent-cyan);}

  .status-pill{display:inline-block; padding:3px 11px; border-radius:20px; font-size:11.5px; font-weight:700; letter-spacing:0.02em; background:var(--surface-2); color:var(--ink-soft); white-space:nowrap; border:1px solid var(--border);}
  .status-pill.offer{background:rgba(126,231,135,.1); color:var(--good); border-color:rgba(126,231,135,.3);}
  .status-pill.reject{background:rgba(255,92,92,.1); color:var(--danger); border-color:rgba(255,92,92,.3);}

  .empty{text-align:center; color:var(--ink-faint); padding:34px 10px; border:1px dashed var(--border); border-radius:10px; font-size:13px;}

  /* --- アコーディオン（面接Q&A） --- */
  .qa-pair{margin:8px 0; border-left:2px solid var(--accent-cyan); border-radius:0 6px 6px 0; overflow:hidden; background:var(--surface);}
  .qa-q{
    width:100%; text-align:left; list-style:none; cursor:pointer; font-weight:700; font-size:13px; color:var(--ink);
    padding:10px 14px; background:transparent; border:none; display:flex; align-items:center; gap:9px;
    font-family:"Noto Sans JP",sans-serif;
  }
  .qa-q::before{content:'▸'; color:var(--accent-cyan); font-size:10px; transition:transform .25s cubic-bezier(.4,0,.2,1);}
  .qa-q.open::before{transform:rotate(90deg);}
  .qa-wrap{display:grid; grid-template-rows:0fr; transition:grid-template-rows .32s cubic-bezier(.4,0,.2,1);}
  .qa-wrap.open{grid-template-rows:1fr;}
  .qa-inner{overflow:hidden;}
  .qa-pair .a{font-size:13px; color:#c9d1d8; margin:0; padding:2px 14px 12px 14px; white-space:pre-wrap; line-height:1.75;}
  .qa-section-title{font-size:11.5px; color:var(--ink-faint); margin:16px 0 8px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase;}
  .qual-row{display:flex; align-items:center; gap:14px; padding:11px 14px; margin:8px 0; background:var(--surface); border-left:2px solid var(--border); border-radius:0 6px 6px 0; flex-wrap:wrap;}
  .qa-q.qual-q{gap:14px; flex-wrap:wrap;}
  .qual-name{font-weight:700; font-size:13.5px; color:var(--ink);}
  .qual-date{font-size:11.5px; color:var(--ink-soft);}
  .qual-note{font-size:11.5px; color:var(--accent-lime); background:rgba(126,231,135,.08); border:1px solid rgba(126,231,135,.25); border-radius:20px; padding:2px 10px;}
  .platform-list{display:flex; flex-direction:column; gap:8px;}
  .platform-item{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:12px 16px; background:var(--card); border:1px solid var(--border-soft); border-radius:8px;
    text-decoration:none; transition:border-color .15s ease, background .15s ease;
  }
  .platform-item:hover{border-color:var(--accent-cyan); background:var(--surface);}
  .platform-name{font-weight:700; font-size:14px; color:var(--ink);}
  .platform-tag{font-size:11px; font-weight:700; padding:3px 12px; border-radius:20px; white-space:nowrap;}
  /* --- 面接想定問答カルーセル --- */
  .carousel-card{
    background:var(--card); border:1px solid var(--border-soft); border-radius:10px;
    padding:22px 24px; min-height:170px; display:flex; flex-direction:column;
  }
  .carousel-cat{
    align-self:flex-start; font-size:10.5px; letter-spacing:0.05em; padding:3px 11px;
    border-radius:20px; margin-bottom:12px; font-weight:700;
  }
  .carousel-cat.general{background:rgba(94,184,255,.1); color:var(--accent-cyan); border:1px solid rgba(94,184,255,.3);}
  .carousel-cat.es{background:rgba(126,231,135,.1); color:var(--accent-lime); border:1px solid rgba(126,231,135,.3);}
  .carousel-cat.company{background:rgba(255,92,92,.1); color:var(--accent-red); border:1px solid rgba(255,92,92,.3);}
  .carousel-q{font-size:15px; font-weight:700; color:var(--ink); margin-bottom:12px; line-height:1.55;}
  .carousel-a{font-size:13.5px; color:#c9d1d8; line-height:1.75; white-space:pre-wrap; flex:1;}
  .carousel-source{font-size:11px; color:var(--ink-faint); margin-top:14px; padding-top:10px; border-top:1px solid var(--border-soft);}
  .carousel-nav{display:flex; align-items:center; justify-content:space-between; margin-top:14px;}
  .carousel-btn{
    background:transparent; border:1px solid var(--border); color:var(--ink-soft); border-radius:50%;
    width:38px; height:38px; cursor:pointer; font-size:18px; display:flex; align-items:center; justify-content:center;
    transition:all .15s ease; flex-shrink:0;
  }
  .carousel-btn:hover{border-color:var(--accent-cyan); color:var(--ink); background:var(--surface);}
  .carousel-counter{font-size:12px; color:var(--ink-faint); letter-spacing:0.02em;}
  .gcal-wrap{border:1px solid var(--border-soft); border-radius:10px; overflow:hidden; background:#101010;}
  .gcal-wrap iframe{display:block;}
  .char-count{font-size:11px; color:var(--ink-faint); margin-top:8px; text-align:right;}
  .pr-tabs{display:flex; gap:6px;}
  .pr-tab{
    background:transparent; border:1px solid var(--border); color:var(--ink-soft); border-radius:20px;
    padding:5px 14px; font-size:12px; cursor:pointer; font-family:"Noto Sans JP",sans-serif; transition:all .15s ease;
  }
  .pr-tab:hover{color:var(--ink); border-color:var(--accent-cyan);}
  .pr-tab.active{background:var(--accent-cyan); color:#101010; border-color:var(--accent-cyan); font-weight:700;}
  .carousel-card{min-height:170px;}
  .tag-scout{background:rgba(126,231,135,.1); color:var(--accent-lime); border:1px solid rgba(126,231,135,.3);}
  .tag-info{background:rgba(94,184,255,.1); color:var(--accent-cyan); border:1px solid rgba(94,184,255,.3);}
  .tag-prep{background:rgba(255,92,92,.1); color:var(--accent-red); border:1px solid rgba(255,92,92,.3);}

  /* --- カレンダー --- */
  .cal-head{display:flex; align-items:center; gap:16px; margin-bottom:18px;}
  .cal-head h2{color:var(--ink); font-size:19px; min-width:130px; font-weight:500;}
  .cal-nav{background:transparent; border:1px solid var(--border); color:var(--ink-soft); border-radius:6px; padding:7px 14px; cursor:pointer; font-size:12.5px; transition:border-color .15s ease, color .15s ease;}
  .cal-nav:hover{border-color:var(--accent-cyan); color:var(--ink);}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); border:1px solid var(--border-soft); background:var(--border-soft); gap:1px; border-radius:10px; overflow:hidden;}
  .cal-dow{background:var(--surface-2); color:var(--ink-soft); text-align:center; padding:8px 0; font-size:11.5px; font-weight:700; letter-spacing:0.04em;}
  .cal-cell{background:var(--card); min-height:88px; padding:6px 7px; font-size:12px; transition:background .15s ease;}
  .cal-cell:not(.blank):hover{background:var(--surface);}
  .cal-cell.blank{background:#131619;}
  .cal-cell .daynum{font-weight:700; color:var(--ink-faint); font-size:12px;}
  .cal-cell.today .daynum{color:#101010; background:var(--accent-lime); border-radius:50%; display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px;}
  .cal-evt{margin-top:3px; padding:2px 6px; border-radius:4px; font-size:10.5px; line-height:1.4; color:#101010; word-break:break-all; font-weight:600;}
  .cal-evt.deadline{background:var(--accent-red);} .cal-evt.interview{background:var(--accent-cyan);} .cal-evt.intern{background:var(--accent-lime);}
  .cal-legend{display:flex; gap:18px; margin:16px 0 6px; font-size:12px; color:var(--ink-soft); align-items:center;}
  .cal-legend span{display:inline-flex; align-items:center; gap:6px;}
  .cal-legend i{width:9px; height:9px; border-radius:2px; display:inline-block;}

  /* --- 志望条件チップ --- */
  .dc-row{margin-bottom:18px;}
  .dc-row:last-child{margin-bottom:0;}
  .dc-label{font-weight:700; color:var(--ink); font-size:12.5px; margin-bottom:9px; padding-left:11px; border-left:2px solid var(--accent-cyan); letter-spacing:0.02em;}
  .dc-chips{display:flex; flex-wrap:wrap; gap:8px;}
  .dc-chip{background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:6px 14px; font-size:12.5px; color:#dfe4e8; white-space:nowrap;}
  .dc-chip b{color:var(--ink); margin-right:5px; font-weight:700;}
  .dc-chip.rank-1{border-color:var(--accent-lime); background:rgba(126,231,135,.08);}
  .dc-chip.rank-1 b{color:var(--accent-lime);}
  .dc-chip.rank-2{border-color:var(--accent-cyan);}
  .dc-chip.rank-2 b{color:var(--accent-cyan);}
  .dc-chip.rank-3{border-color:var(--border); opacity:.75;}

  /* --- 学歴タイムライン --- */
  .edu-timeline{position:relative; padding-left:2px; margin-top:4px;}
  .edu-item{position:relative; padding:0 0 22px 26px; border-left:1px solid var(--border);}
  .edu-item:last-child{border-left:1px solid transparent; padding-bottom:0;}
  .edu-dot{position:absolute; left:-5px; top:3px; width:9px; height:9px; border-radius:50%; box-shadow:0 0 0 4px var(--card);}
  .edu-item:nth-child(3n+1) .edu-dot{background:var(--accent-cyan);}
  .edu-item:nth-child(3n+2) .edu-dot{background:var(--accent-lime);}
  .edu-item:nth-child(3n+3) .edu-dot{background:var(--accent-red);}
  .edu-school{font-weight:700; font-size:14.5px; color:var(--ink); letter-spacing:-0.01em;}
  .edu-period{font-size:12px; color:var(--ink-soft); margin-top:4px; letter-spacing:0.02em; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}

<script>
function esc(str){ return (str ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function nl2br(str){ return esc(str).replace(/\n/g,'<br>'); }
function charCount(str){ return `<div class="char-count">${(str||'').length}文字</div>`; }
function animateHeight(el, newHtml){
  if(!el) return;
  if(el._heightDone){
    el.removeEventListener('transitionend', el._heightDone);
    el._heightDone = null;
    el.style.transition = 'none';
    el.style.height = '';
    el.style.overflow = '';
    void el.offsetHeight;
  }
  const oldHeight = el.getBoundingClientRect().height;
  el.innerHTML = newHtml;
  const newHeight = el.getBoundingClientRect().height;
  if(Math.abs(oldHeight - newHeight) < 1) return;
  el.style.transition = 'none';
  el.style.height = oldHeight + 'px';
  el.style.overflow = 'hidden';
  void el.offsetHeight;
  el.style.transition = 'height .32s cubic-bezier(.4,0,.2,1)';
  el.style.height = newHeight + 'px';
  const done = (e)=>{
    if(e && e.propertyName && e.propertyName !== 'height') return;
    el.style.height = '';
    el.style.overflow = '';
    el.style.transition = '';
    el.removeEventListener('transitionend', done);
    el._heightDone = null;
  };
  el._heightDone = done;
  el.addEventListener('transitionend', done);
}

let data = { self:{}, industries:[], companies:[], interns:[], quals:[], activities:[] };
let currentTab = 'self';
let sort = { key:'name', dir:'desc' };
let prVariantIndex = 0;
let gakuchikaIndex = 0;
let interviewIndex = 0;
const calState = { year:new Date().getFullYear(), month:new Date().getMonth() };

async function init(){
  try{
    const r = await fetch('./data.json?t=' + Date.now(), { cache:'no-store' });
    data = await r.json();
    if(data.updatedAt) document.getElementById('updated').textContent = '最終更新: ' + data.updatedAt;
  }catch(e){
    document.getElementById('main').innerHTML = '<div class="empty">データの読み込みに失敗した。少し待ってから再読み込みしてみて</div>';
    return;
  }
  render();
}

document.body.addEventListener('click', (e)=>{
  const tabBtn = e.target.closest('.tab-btn');
  if(tabBtn){
    if(tabBtn.classList.contains('active')) return;
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    tabBtn.classList.add('active');
    currentTab = tabBtn.dataset.tab;
    moveIndicator(tabBtn);
    render(true);
    return;
  }
  const gakuTab = e.target.closest('.gaku-tab');
  if(gakuTab){ gakuchikaIndex = parseInt(gakuTab.dataset.idx); updateGakuchika(); return; }

  const prTab = e.target.closest('.pr-tab');
  if(prTab){ prVariantIndex = parseInt(prTab.dataset.idx); updatePR(); return; }

  const carPrev = e.target.closest('#carPrev');
  if(carPrev){
    const bank = (data.self && data.self.interviewBank) || [];
    if(bank.length){ interviewIndex = (interviewIndex - 1 + bank.length) % bank.length; updateCarousel(); }
    return;
  }
  const carNext = e.target.closest('#carNext');
  if(carNext){
    const bank = (data.self && data.self.interviewBank) || [];
    if(bank.length){ interviewIndex = (interviewIndex + 1) % bank.length; updateCarousel(); }
    return;
  }
  const sortDirBtn = e.target.closest('#sortDirBtn');
  if(sortDirBtn){ sort.dir = sort.dir==='asc' ? 'desc' : 'asc'; updateCompanyList(); return; }

  const calNav = e.target.closest('.cal-nav');
  if(calNav){ shiftMonth(parseInt(calNav.dataset.shift)); return; }

  const qaQ = e.target.closest('.qa-q');
  if(qaQ){
    const wrap = qaQ.nextElementSibling;
    const isOpen = wrap.classList.toggle('open');
    qaQ.classList.toggle('open', isOpen);
    return;
  }
  const coToggle = e.target.closest('.co-toggle');
  if(coToggle){
    const wrap = coToggle.nextElementSibling;
    const isOpen = wrap.classList.toggle('open');
    coToggle.textContent = isOpen ? '企業研究を閉じる ▴' : '企業研究を見る ▾';
    return;
  }
});
document.body.addEventListener('change', (e)=>{
  const sel = e.target.closest('#sortKeySelect');
  if(sel){ sort.key = sel.value; updateCompanyList(); return; }
});
let touchStartX = null;
document.body.addEventListener('touchstart', (e)=>{
  if(e.target.closest('#interviewCarousel')) touchStartX = e.touches[0].clientX;
}, {passive:true});
document.body.addEventListener('touchend', (e)=>{
  if(touchStartX===null) return;
  if(e.target.closest('#interviewCarousel')){
    const dx = e.changedTouches[0].clientX - touchStartX;
    const bank = (data.self && data.self.interviewBank) || [];
    if(Math.abs(dx) > 40 && bank.length){
      if(dx < 0) interviewIndex = (interviewIndex + 1) % bank.length;
      else interviewIndex = (interviewIndex - 1 + bank.length) % bank.length;
      updateCarousel();
    }
  }
  touchStartX = null;
});
function moveIndicator(btn){
  const ind = document.getElementById('tab-indicator');
  if(!ind || window.innerWidth <= 760) return;
  ind.style.top = btn.offsetTop + 'px';
  ind.style.height = btn.offsetHeight + 'px';
  ind.style.opacity = '1';
}
window.addEventListener('load', ()=>{
  const activeBtn = document.querySelector('.tab-btn.active');
  if(activeBtn) moveIndicator(activeBtn);
});

function render(skipAnim){
  const main = document.getElementById('main');
  if(currentTab==='self') main.innerHTML = renderSelf();
  else if(currentTab==='research') main.innerHTML = renderResearch();
  else if(currentTab==='industry') main.innerHTML = renderIndustry();
  else if(currentTab==='company') main.innerHTML = renderCompany();
  else if(currentTab==='intern') main.innerHTML = renderIntern();
  else if(currentTab==='skill') main.innerHTML = renderSkill();
  else if(currentTab==='interview') main.innerHTML = renderInterviewPrep();
  else if(currentTab==='calendar') main.innerHTML = renderCalendar();
  if(!skipAnim){
    main.classList.remove('fade-out');
    void main.offsetWidth;
    main.classList.add('fade-in');
    const staggerEls = main.querySelectorAll('.card, tbody tr');
    staggerEls.forEach((el, i)=>{ el.style.animationDelay = Math.min(i*35, 400) + 'ms'; });
  }
}

function renderEducation(text){
  if(!text) return '<p class="body"><span class="muted">未入力</span></p>';
  const rawLines = text.split('\n').filter(l=>l.trim());
  const items = [];
  rawLines.forEach(line=>{
    const isSub = /^\t|^\s{2,}/.test(line);
    const m = line.trim().match(/^(.+?)[（(](.+?)[）)]\s*$/);
    let entry;
    if(!m){ entry = { school: line.trim(), period: '', notes: [] }; }
    else{
      const school = m[1].trim();
      const parts = m[2].split(/、|,/).map(p=>p.trim()).filter(Boolean);
      entry = { school, period: parts[0] || '', notes: parts.slice(1) };
    }
    if(isSub && items.length){
      const parent = items[items.length-1];
      parent.subs = parent.subs || [];
      parent.subs.push(entry);
    } else {
      entry.subs = [];
      items.push(entry);
    }
  });
  return `<div class="edu-timeline">${items.map(it=>`
    <div class="edu-item">
      <div class="edu-dot"></div>
      <div class="edu-school">${esc(it.school)}</div>
      ${(it.period || it.notes.length) ? `<div class="edu-period">${esc(it.period)}${it.notes.map(n=>`<span class="edu-note">${esc(n)}</span>`).join('')}</div>` : ''}
      ${it.subs.map(sub=>`
        <div class="edu-sub">
          <span class="edu-sub-name">${esc(sub.school)}</span>
          ${sub.period ? `<span class="edu-sub-period">${esc(sub.period)}</span>` : ''}
          ${sub.notes.map(n=>`<span class="edu-note">${esc(n)}</span>`).join('')}
        </div>
      `).join('')}
    </div>
  `).join('')}</div>`;
}
function renderSelf(){
  const s = data.self || {};
  const g = s.gakuchika || [];
  return `
  <div class="section-head"><h1>自己分析</h1><p>強み・弱み・自己PR・学歴・ガクチカ</p></div>
  <div class="card">
    <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;">
      <h3 style="margin:0;">自己PR</h3>
      ${(s.prVariants && s.prVariants.length>1) ? `<div class="pr-tabs">${s.prVariants.map((v,i)=>`<button type="button" class="pr-tab ${i===prVariantIndex?'active':''}" data-idx="${i}">${esc(v.label)}</button>`).join('')}</div>` : ''}
    </div>
    <div id="prBody">${prBodyHtml(s)}</div>
    <div class="char-count" id="prCharCount">${charCount(prCurrentText(s))}</div>
  </div>
  <div class="card"><h3>学歴</h3>${renderEducation(s.education)}</div>
  <div class="card"><h3>強み</h3><p class="body">${s.strengths ? nl2br(s.strengths) : '<span class="muted">未入力</span>'}</p>${charCount(s.strengths)}</div>
  <div class="card"><h3>弱み</h3><p class="body">${s.weaknesses ? nl2br(s.weaknesses) : '<span class="muted">未入力</span>'}</p>${charCount(s.weaknesses)}</div>
  <div class="card"><h3>これからやってみたいこと</h3><p class="body">${s.vision ? nl2br(s.vision) : '<span class="muted">未入力</span>'}</p>${charCount(s.vision)}</div>
  <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-top:30px;">
    <h3 style="margin:0; font-size:16px; font-weight:700; color:var(--ink); letter-spacing:-0.01em;">ガクチカ</h3>
    ${g.length>1 ? `<div class="pr-tabs">${g.map((item,i)=>`<button type="button" class="pr-tab gaku-tab ${i===gakuchikaIndex?'active':''}" data-idx="${i}">パターン${i+1}</button>`).join('')}</div>` : ''}
  </div>
  ${gakuOuterHtml(g)}
  `;
}
function prCurrentText(s){
  const variants = s.prVariants && s.prVariants.length ? s.prVariants : (s.pr ? [{label:'自己PR', text:s.pr}] : []);
  const cur = variants[prVariantIndex] || variants[0];
  return cur ? cur.text : '';
}
function prBodyHtml(s){
  const text = prCurrentText(s);
  return `<p class="body" style="margin-top:14px;">${text ? nl2br(text) : '<span class="muted">未入力</span>'}</p>`;
}
function updatePR(){
  document.querySelectorAll('.pr-tab:not(.gaku-tab)').forEach(b=>{
    b.classList.toggle('active', parseInt(b.dataset.idx)===prVariantIndex);
  });
  const s = data.self || {};
  animateHeight(document.getElementById('prBody'), prBodyHtml(s));
  const cc = document.getElementById('prCharCount');
  if(cc) cc.innerHTML = charCount(prCurrentText(s));
}
function gakuCurrentItem(g){
  return (g && g.length) ? (g[gakuchikaIndex] || g[0]) : null;
}
function gakuBodyHtml(item){
  if(!item) return '';
  return `<h3>${esc(item.title) || '（無題）'}</h3><p class="body">${nl2br(item.content)}</p>`;
}
function gakuQAHtml(item){
  if(!item) return '';
  return `
    ${(item.qa && item.qa.length) ? `<div class="qa-section-title">面接での対応例</div>` : ''}
    ${(item.qa||[]).map(qa=>`
      <div class="qa-pair"><button type="button" class="qa-q">${esc(qa.q)}</button><div class="qa-wrap"><div class="qa-inner"><div class="a">${esc(qa.a)}</div></div></div></div>
    `).join('')}
  `;
}
function gakuOuterHtml(g){
  const item = gakuCurrentItem(g);
  if(!item) return '<div class="empty">まだ登録なし</div>';
  return `
  <div class="card">
    <div id="gakuBody">${gakuBodyHtml(item)}</div>
    <div class="char-count" id="gakuCharCount">${charCount(item.content)}</div>
    <div id="gakuQA">${gakuQAHtml(item)}</div>
  </div>
  `;
}
function updateGakuchika(){
  document.querySelectorAll('.gaku-tab').forEach(b=>{
    b.classList.toggle('active', parseInt(b.dataset.idx)===gakuchikaIndex);
  });
  const item = gakuCurrentItem((data.self && data.self.gakuchika) || []);
  if(!item) return;
  animateHeight(document.getElementById('gakuBody'), gakuBodyHtml(item));
  const cc = document.getElementById('gakuCharCount');
  if(cc) cc.innerHTML = charCount(item.content);
  const qa = document.getElementById('gakuQA');
  if(qa) qa.innerHTML = gakuQAHtml(item);
}
function carouselCatMeta(item){
  const catMeta = {
    general: {label:'一般的な質問', cls:'general'},
    es: {label:'ES内容からの深掘り', cls:'es'},
    company: {label:'企業の過去の質問', cls:'company'}
  };
  return catMeta[item.category] || catMeta.general;
}
function carouselCardHtml(item){
  const meta = carouselCatMeta(item);
  return `
      <span class="carousel-cat ${meta.cls}">${meta.label}</span>
      <div class="carousel-q">${esc(item.q)}</div>
      <div class="carousel-a">${nl2br(item.a)}</div>
      ${item.source ? `<div class="carousel-source">出典：${esc(item.source)}</div>` : ''}
  `;
}
function renderInterviewCarousel(bank){
  if(!bank || !bank.length) return '<div class="empty">まだ登録なし</div>';
  const idx = ((interviewIndex % bank.length) + bank.length) % bank.length;
  const item = bank[idx];
  return `
  <div class="carousel" id="interviewCarousel">
    <div class="carousel-card" id="carouselCard">${carouselCardHtml(item)}</div>
    <div class="carousel-nav">
      <button type="button" class="carousel-btn" id="carPrev">‹</button>
      <span class="carousel-counter" id="carCounter">${idx+1} / ${bank.length}</span>
      <button type="button" class="carousel-btn" id="carNext">›</button>
    </div>
  </div>`;
}
function updateCarousel(){
  const bank = (data.self && data.self.interviewBank) || [];
  if(!bank.length) return;
  const idx = ((interviewIndex % bank.length) + bank.length) % bank.length;
  const item = bank[idx];
  animateHeight(document.getElementById('carouselCard'), carouselCardHtml(item));
  const counterEl = document.getElementById('carCounter');
  if(counterEl) counterEl.textContent = `${idx+1} / ${bank.length}`;
}

function renderDesiredConditions(text){
  if(!text) return '<p class="body"><span class="muted">未入力</span></p>';
  const lines = text.split('\n').filter(Boolean);
  return lines.map(line=>{
    const m = line.match(/^【(.+?)】(.*)$/);
    if(!m) return `<div class="dc-row"><div class="dc-chips"><span class="dc-chip">${esc(line)}</span></div></div>`;
    const label = m[1];
    const rest = m[2];
    const parts = rest.split('／').map(p=>p.trim()).filter(Boolean);
    const chips = parts.map(p=>{
      const pm = p.match(/^(第[一二三四五]志望)[:：](.*)$/);
      if(pm){
        const rankClass = pm[1]==='第一志望' ? 'rank-1' : pm[1]==='第二志望' ? 'rank-2' : 'rank-3';
        return `<span class="dc-chip ${rankClass}"><b>${esc(pm[1])}</b>${esc(pm[2])}</span>`;
      }
      return `<span class="dc-chip">${esc(p)}</span>`;
    }).join('');
    return `<div class="dc-row"><div class="dc-label">${esc(label)}</div><div class="dc-chips">${chips}</div></div>`;
  }).join('');
}
function renderResearch(){
  const r = data.research || {};
  if(!r.title && !r.overview){
    return `<div class="section-head"><h1>研究</h1><p>研究テーマや内容</p></div><div class="empty">まだ登録なし</div>`;
  }
  return `
  <div class="section-head"><h1>研究</h1><p>研究テーマ・内容・意義</p></div>
  <div class="card"><h3>${esc(r.title) || '研究テーマ'}</h3></div>
  <div class="card"><h3>研究概要</h3><p class="body">${nl2br(r.overview)}</p>${charCount(r.overview)}</div>
  <div class="card"><h3>研究の意義</h3><p class="body">${nl2br(r.significance)}</p>${charCount(r.significance)}</div>
  <div class="card"><h3>研究を選んだ理由</h3><p class="body">${nl2br(r.reason)}</p>${charCount(r.reason)}</div>
  <div class="card"><h3>研究から学んだこと</h3><p class="body">${nl2br(r.learned)}</p>${charCount(r.learned)}</div>
  ${r.future ? `<div class="card"><h3>今後の展望</h3><p class="body">${nl2br(r.future)}</p>${charCount(r.future)}</div>` : ''}
  `;
}
function renderIndustry(){
  const s = data.self || {};
  const list = data.industries || [];
  return `
  <div class="section-head"><h1>志望業界</h1><p>興味のある業界と志望条件</p></div>
  <div class="card"><h3>志望条件まとめ</h3>${renderDesiredConditions(s.desiredConditions)}</div>
  ${list.length===0 ? '' : list.map(i=>`
    <div class="card"><h3>${esc(i.name)}</h3><p class="body">${nl2br(i.note)}</p></div>
  `).join('')}
  `;
}

const STATUS_LABEL = {};
const COL_DEFS = [
  {key:'name', label:'企業名', type:'text'},
  {key:'industry', label:'業界', type:'text'},
  {key:'location', label:'本拠地', type:'text'},
  {key:'salaryStart', label:'院卒初任給(月給/円)', type:'num'},
  {key:'annualSalary', label:'平均年収(万円)', type:'num'},
  {key:'avgAge', label:'平均年齢(歳)', type:'num'},
  {key:'holidays', label:'年間休日(日)', type:'num'},
  {key:'holidayDetail', label:'休日内訳', type:'text'},
  {key:'status', label:'選考状況', type:'text'},
  {key:'memo', label:'メモ', type:'text'},
];

function sortCompanies(arr){
  const list = [...arr];
  list.sort((a,b)=>{
    const def = COL_DEFS.find(c=>c.key===sort.key);
    let va = a[sort.key], vb = b[sort.key];
    if(def && def.type==='num'){ va = Number(va)||0; vb = Number(vb)||0; return sort.dir==='asc' ? va-vb : vb-va; }
    va = (va||'').toString(); vb = (vb||'').toString();
    return sort.dir==='asc' ? va.localeCompare(vb,'ja') : vb.localeCompare(va,'ja');
  });
  return list;
}
function statusPill(status){
  let cls = ''; if(status==='内定') cls='offer'; if(status==='不合格' || status==='辞退') cls='reject';
  return `<span class="status-pill ${cls}">${esc(status||'未応募')}</span>`;
}
function coDetailRow(label, text){
  return `<div class="co-detail-row"><span class="co-detail-label">${esc(label)}</span><p>${text ? nl2br(text) : '<span class="muted">未調査</span>'}</p></div>`;
}
function companyCard(c){
  const salaryHigh = c.salaryStart && Number(c.salaryStart) >= 280000;
  const osakaHQ = c.location && c.location.includes('大阪');
  const holidaysHigh = c.holidays && Number(c.holidays) >= 122;

  const r = c.research || {};
  return `
  <div class="co-card ${c.favorite ? 'co-fav' : ''}">

function companyCardsHtml(){
  const all = data.companies || [];
  const favs = sortCompanies(all.filter(c=>c.favorite));
  const rest = sortCompanies(all.filter(c=>!c.favorite));
  if(!all.length) return '<div class="empty">まだ企業が登録されてない</div>';
  let html = '';
  if(favs.length){
    html += `<div class="co-group-title">★ お気に入り</div>`;
    html += favs.map(companyCard).join('');
    if(rest.length) html += `<div class="co-group-title">その他の企業</div>`;
  }
  html += rest.map(companyCard).join('');
  return html;
}

function pad(n){ return n.toString().padStart(2,'0'); }
function collectEvents(){
  const evts = [];
  (data.interns||[]).forEach(i=>{ if(i.date) evts.push({date:i.date, label:`${i.company} インターン`, type:'intern'}); });
  return evts;
}
const GCAL_IDS = [
  '88ndb9hbsa7pbu490hbs9f5d68vng6gb@import.calendar.google.com',
  'ee09rt29rc5bj0p47iqbkmbhhocqod7f@import.calendar.google.com',
  'ja.japanese#holiday@group.v.calendar.google.com'
];
function gcalEmbedUrl(){
  const srcParams = GCAL_IDS.map(id=>`src=${encodeURIComponent(id)}`).join('&');
  return `https://calendar.google.com/calendar/embed?${srcParams}&ctz=Asia%2FTokyo&mode=MONTH&showTitle=0&showNav=1&showTabs=0&showCalendars=0&showTz=0&showPrint=0&bgcolor=%23101010`;
}
function calGridHtml(){
  const evts = collectEvents();
  const y = calState.year, m = calState.month;
  const first = new Date(y, m, 1);
  const startOffset = first.getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const todayStr = new Date().toISOString().slice(0,10);
  const dow = ['日','月','火','水','木','金','土'];
  let cells = '';
  for(let i=0;i<startOffset;i++) cells += `<div class="cal-cell blank"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${y}-${pad(m+1)}-${pad(d)}`;
    const dayEvts = evts.filter(e=>e.date===dateStr);
    cells += `<div class="cal-cell ${dateStr===todayStr?'today':''}"><div class="daynum">${d}</div>${dayEvts.map(e=>`<div class="cal-evt ${e.type}">${esc(e.label)}</div>`).join('')}</div>`;
  }
  return { html: dow.map(d=>`<div class="cal-dow">${d}</div>`).join('') + cells, empty: evts.length===0 };
}
function renderCalendar(){
  const y = calState.year, m = calState.month;
  const grid = calGridHtml();
  return `
  <div class="section-head"><h1>カレンダー</h1><p>Googleカレンダー(就活・イベント)を反映</p></div>
  <div class="gcal-wrap">
    <iframe src="${gcalEmbedUrl()}" style="border:0" width="100%" height="600" frameborder="0" scrolling="no"></iframe>
  </div>
  <h3 style="font-size:16px; font-weight:700; color:var(--ink); margin:30px 0 14px; letter-spacing:-0.01em;">インターン開始日カレンダー</h3>
  <div class="cal-head">
    <button class="cal-nav" data-shift="-1">← 前月</button>
    <h2 id="calMonthLabel">${y}年 ${m+1}月</h2>
    <button class="cal-nav" data-shift="1">次月 →</button>
  </div>
  <div class="cal-legend">
    <span><i style="background:var(--accent-lime);"></i>インターン</span>
  </div>
  <div class="cal-grid" id="calGrid">${grid.html}</div>
  <div id="calEmptyMsg">${grid.empty ? '<div class="empty" style="margin-top:16px;">まだ予定なし</div>' : ''}</div>
  `;
}
function shiftMonth(diff){
  calState.month += diff;
  if(calState.month<0){ calState.month=11; calState.year--; }
  if(calState.month>11){ calState.month=0; calState.year++; }
  updateCalendar();
}
function updateCalendar(){
  const labelEl = document.getElementById('calMonthLabel');
  if(labelEl) labelEl.textContent = `${calState.year}年 ${calState.month+1}月`;
  const grid = calGridHtml();
  const gridEl = document.getElementById('calGrid');
  if(gridEl) gridEl.innerHTML = grid.html;
  const emptyEl = document.getElementById('calEmptyMsg');
  if(emptyEl) emptyEl.innerHTML = grid.empty ? '<div class="empty" style="margin-top:16px;">まだ予定なし</div>' : '';
}
