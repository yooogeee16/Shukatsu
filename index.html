<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="就活ノート">
<meta name="theme-color" content="#101010">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<title>就活ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#101010; --surface:#1a1e22; --surface-2:#20262c; --card:#191d21;
    --ink:#fffdf9; --ink-soft:#8b9aa8; --ink-faint:#5b6570;
    --border:#33383d; --border-soft:#26292d;
    --accent-red:#ff5c5c; --accent-cyan:#5eb8ff; --accent-lime:#7ee787;
    --good:#7ee787; --danger:#ff5c5c; --info:#5eb8ff;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); font-family:"Noto Sans JP",sans-serif; color:var(--ink); min-height:100vh; -webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:"Noto Sans JP",sans-serif; margin:0 0 .4em 0; font-weight:400; letter-spacing:-0.01em;}
  .app{display:flex; min-height:100vh;}

  /* --- サイドバー：ゴーストナビ --- */
  .sidebar{width:196px; flex-shrink:0; padding:32px 0 28px 22px; display:flex; flex-direction:column; gap:2px; position:relative;}
  .sidebar .brand{color:var(--ink); font-size:18px; font-weight:500; letter-spacing:-0.01em; padding:0 8px 22px 4px; line-height:1.5;}
  .sidebar .updated{color:var(--ink-faint); font-size:10.5px; padding:0 8px 18px 4px; letter-spacing:0.02em;}
  .tab-btn{
    position:relative; text-align:left; border:none; cursor:pointer; padding:12px 16px;
    font-family:"Noto Sans JP",sans-serif; font-size:12.5px; font-weight:500; letter-spacing:0.06em;
    color:var(--ink-soft); background:transparent; border-radius:3px 0 0 3px;
    transition:color .2s ease;
  }
  .tab-btn:hover{color:var(--ink);}
  .tab-btn.active{color:var(--ink); font-weight:700;}
  .tab-indicator{
    position:absolute; left:0; width:3px; border-radius:0 3px 3px 0;
    background:linear-gradient(180deg, var(--accent-red), var(--accent-cyan) 55%, var(--accent-lime));
    transition:top .32s cubic-bezier(.4,0,.2,1), height .32s cubic-bezier(.4,0,.2,1);
    top:0; height:0; opacity:0;
  }

  /* --- メインエリア --- */
  .main{flex:1; background:var(--bg); padding:44px 52px 70px; min-width:0;}
  .main.fade-out{opacity:0; transform:translateY(6px); transition:opacity .12s ease, transform .12s ease;}
  .main.fade-in{animation:fadeSlideUp .38s cubic-bezier(.16,1,.3,1) both;}
  @keyframes fadeSlideUp{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

  .section-head{margin-bottom:30px; position:relative; padding-bottom:18px;}
  .section-head h1{font-size:clamp(30px,4vw,46px); line-height:1.05; color:var(--ink); font-weight:400;}
  .section-head::after{
    content:''; position:absolute; left:0; bottom:0; width:64px; height:3px; border-radius:2px;
    background:linear-gradient(90deg, var(--accent-red), var(--accent-cyan), var(--accent-lime));
  }
  .section-head p{margin:6px 0 0; color:var(--ink-soft); font-size:13px; letter-spacing:0.01em;}

  .card{
    background:var(--card); border:1px solid var(--border-soft); border-radius:10px;
    padding:22px 24px; margin-bottom:16px;
    opacity:0; animation:fadeSlideUp .5s cubic-bezier(.16,1,.3,1) forwards;
    transition:border-color .2s ease, background .2s ease;
  }
  .card:hover{border-color:var(--border);}
  .card h3{font-size:15px; color:var(--ink); font-weight:700; letter-spacing:-0.01em;}
  .card .body{white-space:pre-wrap; font-size:14px; line-height:1.75; margin:0; color:#d8dee3;}
  .muted{color:var(--ink-faint); font-size:13px;}

  table{width:100%; border-collapse:collapse; font-size:13px; background:transparent;}
  thead th{
    text-align:left; padding:11px 12px; background:var(--surface-2); color:var(--ink-soft);
    font-weight:500; letter-spacing:0.03em; cursor:pointer; user-select:none; white-space:nowrap;
    border-bottom:1px solid var(--border); transition:color .15s ease, background .15s ease;
  }
  thead th:hover{color:var(--ink); background:#262c32;}
  thead th .arrow{font-size:10px; margin-left:4px; color:var(--accent-cyan); display:inline-block; transition:transform .2s ease;}
  tbody td{padding:11px 12px; border-bottom:1px solid var(--border-soft); vertical-align:top; white-space:nowrap; color:#dfe4e8;}
  tbody tr{opacity:0; animation:fadeSlideUp .4s cubic-bezier(.16,1,.3,1) forwards; transition:background .15s ease;}
  tbody tr:hover{background:var(--surface);}
  .table-wrap{overflow-x:auto; border:1px solid var(--border-soft); border-radius:10px;}
  .company-link{color:var(--ink); font-weight:700; text-decoration:none; border-bottom:1px solid var(--accent-cyan); transition:color .15s ease, border-color .15s ease;}
  .company-link:hover{color:var(--accent-cyan);}

  .status-pill{display:inline-block; padding:3px 11px; border-radius:20px; font-size:11.5px; font-weight:700; letter-spacing:0.02em; background:var(--surface-2); color:var(--ink-soft); white-space:nowrap; border:1px solid var(--border);}
  .status-pill.offer{background:rgba(126,231,135,.1); color:var(--good); border-color:rgba(126,231,135,.3);}
  .status-pill.reject{background:rgba(255,92,92,.1); color:var(--danger); border-color:rgba(255,92,92,.3);}

  .empty{text-align:center; color:var(--ink-faint); padding:34px 10px; border:1px dashed var(--border); border-radius:10px; font-size:13px;}

  /* --- アコーディオン（面接Q&A） --- */
  .qa-pair{margin:8px 0; border-left:2px solid var(--accent-cyan); border-radius:0 6px 6px 0; overflow:hidden; background:var(--surface);}
  .qa-q{
    width:100%; text-align:left; list-style:none; cursor:pointer; font-weight:700; font-size:13px; color:var(--ink);
    padding:10px 14px; background:transparent; border:none; display:flex; align-items:center; gap:9px;
    font-family:"Noto Sans JP",sans-serif;
  }
  .qa-q::before{content:'▸'; color:var(--accent-cyan); font-size:10px; transition:transform .25s cubic-bezier(.4,0,.2,1);}
  .qa-q.open::before{transform:rotate(90deg);}
  .qa-wrap{display:grid; grid-template-rows:0fr; transition:grid-template-rows .32s cubic-bezier(.4,0,.2,1);}
  .qa-wrap.open{grid-template-rows:1fr;}
  .qa-inner{overflow:hidden;}
  .qa-pair .a{font-size:13px; color:#c9d1d8; margin:0; padding:2px 14px 12px 14px; white-space:pre-wrap; line-height:1.75;}
  .qa-section-title{font-size:11.5px; color:var(--ink-faint); margin:16px 0 8px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase;}

  /* --- カレンダー --- */
  .cal-head{display:flex; align-items:center; gap:16px; margin-bottom:18px;}
  .cal-head h2{color:var(--ink); font-size:19px; min-width:130px; font-weight:500;}
  .cal-nav{background:transparent; border:1px solid var(--border); color:var(--ink-soft); border-radius:6px; padding:7px 14px; cursor:pointer; font-size:12.5px; transition:border-color .15s ease, color .15s ease;}
  .cal-nav:hover{border-color:var(--accent-cyan); color:var(--ink);}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); border:1px solid var(--border-soft); background:var(--border-soft); gap:1px; border-radius:10px; overflow:hidden;}
  .cal-dow{background:var(--surface-2); color:var(--ink-soft); text-align:center; padding:8px 0; font-size:11.5px; font-weight:700; letter-spacing:0.04em;}
  .cal-cell{background:var(--card); min-height:88px; padding:6px 7px; font-size:12px; transition:background .15s ease;}
  .cal-cell:not(.blank):hover{background:var(--surface);}
  .cal-cell.blank{background:#131619;}
  .cal-cell .daynum{font-weight:700; color:var(--ink-faint); font-size:12px;}
  .cal-cell.today .daynum{color:#101010; background:var(--accent-lime); border-radius:50%; display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px;}
  .cal-evt{margin-top:3px; padding:2px 6px; border-radius:4px; font-size:10.5px; line-height:1.4; color:#101010; word-break:break-all; font-weight:600;}
  .cal-evt.deadline{background:var(--accent-red);} .cal-evt.interview{background:var(--accent-cyan);} .cal-evt.intern{background:var(--accent-lime);}
  .cal-legend{display:flex; gap:18px; margin:16px 0 6px; font-size:12px; color:var(--ink-soft); align-items:center;}
  .cal-legend span{display:inline-flex; align-items:center; gap:6px;}
  .cal-legend i{width:9px; height:9px; border-radius:2px; display:inline-block;}

  /* --- 志望条件チップ --- */
  .dc-row{margin-bottom:18px;}
  .dc-row:last-child{margin-bottom:0;}
  .dc-label{font-weight:700; color:var(--ink); font-size:12.5px; margin-bottom:9px; padding-left:11px; border-left:2px solid var(--accent-cyan); letter-spacing:0.02em;}
  .dc-chips{display:flex; flex-wrap:wrap; gap:8px;}
  .dc-chip{background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:6px 14px; font-size:12.5px; color:#dfe4e8; white-space:nowrap;}
  .dc-chip b{color:var(--ink); margin-right:5px; font-weight:700;}
  .dc-chip.rank-1{border-color:var(--accent-lime); background:rgba(126,231,135,.08);}
  .dc-chip.rank-1 b{color:var(--accent-lime);}
  .dc-chip.rank-2{border-color:var(--accent-cyan);}
  .dc-chip.rank-2 b{color:var(--accent-cyan);}
  .dc-chip.rank-3{border-color:var(--border); opacity:.75;}

  @media (max-width:760px){
    .app{flex-direction:column;}
    .sidebar{width:100%; flex-direction:row; overflow-x:auto; padding:16px 14px; gap:4px;}
    .sidebar .brand, .sidebar .updated, .tab-indicator{display:none;}
    .tab-btn{border-radius:6px; white-space:nowrap;}
    .main{padding:26px 18px 54px;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="tab-indicator" id="tab-indicator"></div>
    <div class="brand">就活ノート</div>
    <div class="updated" id="updated"></div>
    <button class="tab-btn active" data-tab="self">自己分析</button>
    <button class="tab-btn" data-tab="research">研究</button>
    <button class="tab-btn" data-tab="industry">志望業界</button>
    <button class="tab-btn" data-tab="company">企業一覧</button>
    <button class="tab-btn" data-tab="intern">インターン</button>
    <button class="tab-btn" data-tab="skill">資格・経験</button>
    <button class="tab-btn" data-tab="calendar">カレンダー</button>
  </div>
  <div class="main" id="main"><div class="empty">読み込み中…</div></div>
</div>
<script>
function esc(str){ return (str ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function nl2br(str){ return esc(str).replace(/\n/g,'<br>'); }

let data = { self:{}, industries:[], companies:[], interns:[], quals:[], activities:[] };
let currentTab = 'self';
let sort = { key:'name', dir:'asc' };
const calState = { year:new Date().getFullYear(), month:new Date().getMonth() };

async function init(){
  try{
    const r = await fetch('./data.json?t=' + Date.now(), { cache:'no-store' });
    data = await r.json();
    if(data.updatedAt) document.getElementById('updated').textContent = '最終更新: ' + data.updatedAt;
  }catch(e){
    document.getElementById('main').innerHTML = '<div class="empty">データの読み込みに失敗した。少し待ってから再読み込みしてみて</div>';
    return;
  }
  render();
}

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    if(btn.classList.contains('active')) return;
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    moveIndicator(btn);
    const main = document.getElementById('main');
    main.classList.remove('fade-in');
    main.classList.add('fade-out');
    setTimeout(()=>{ render(); }, 110);
  });
});
function moveIndicator(btn){
  const ind = document.getElementById('tab-indicator');
  if(!ind || window.innerWidth <= 760) return;
  ind.style.top = btn.offsetTop + 'px';
  ind.style.height = btn.offsetHeight + 'px';
  ind.style.opacity = '1';
}
window.addEventListener('load', ()=>{
  const activeBtn = document.querySelector('.tab-btn.active');
  if(activeBtn) moveIndicator(activeBtn);
});

function render(){
  const main = document.getElementById('main');
  if(currentTab==='self') main.innerHTML = renderSelf();
  else if(currentTab==='research') main.innerHTML = renderResearch();
  else if(currentTab==='industry') main.innerHTML = renderIndustry();
  else if(currentTab==='company') main.innerHTML = renderCompany();
  else if(currentTab==='intern') main.innerHTML = renderIntern();
  else if(currentTab==='skill') main.innerHTML = renderSkill();
  else if(currentTab==='calendar') main.innerHTML = renderCalendar();
  document.querySelectorAll('th[data-sort]').forEach(th=>{
    th.addEventListener('click', ()=>{ setSort(th.dataset.sort); });
  });
  document.querySelectorAll('.cal-nav').forEach(btn=>{
    btn.addEventListener('click', ()=>{ shiftMonth(parseInt(btn.dataset.shift)); });
  });
  document.querySelectorAll('.qa-q').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const wrap = btn.nextElementSibling;
      const isOpen = wrap.classList.toggle('open');
      btn.classList.toggle('open', isOpen);
    });
  });
  main.classList.remove('fade-out');
  void main.offsetWidth;
  main.classList.add('fade-in');
  const staggerEls = main.querySelectorAll('.card, tbody tr');
  staggerEls.forEach((el, i)=>{ el.style.animationDelay = Math.min(i*35, 400) + 'ms'; });
}

function renderSelf(){
  const s = data.self || {};
  const g = s.gakuchika || [];
  return `
  <div class="section-head"><h1>自己分析</h1><p>強み・弱み・自己PR・学歴・ガクチカ</p></div>
  <div class="card"><h3>自己PR</h3><p class="body">${s.pr ? nl2br(s.pr) : '<span class="muted">未入力</span>'}</p></div>
  <div class="card"><h3>学歴</h3><p class="body">${s.education ? nl2br(s.education) : '<span class="muted">未入力</span>'}</p></div>
  <div class="card"><h3>強み</h3><p class="body">${s.strengths ? nl2br(s.strengths) : '<span class="muted">未入力</span>'}</p></div>
  <div class="card"><h3>弱み</h3><p class="body">${s.weaknesses ? nl2br(s.weaknesses) : '<span class="muted">未入力</span>'}</p></div>
  <div class="card"><h3>これからやってみたいこと</h3><p class="body">${s.vision ? nl2br(s.vision) : '<span class="muted">未入力</span>'}</p></div>
  <h3 style="font-size:16px; font-weight:700; color:var(--ink); margin-top:30px; letter-spacing:-0.01em;">ガクチカ</h3>
  ${g.length===0 ? '<div class="empty">まだ登録なし</div>' : g.map(item=>`
    <div class="card">
      <h3>${esc(item.title) || '（無題）'}</h3>
      <p class="body">${nl2br(item.content)}</p>
      ${(item.qa && item.qa.length) ? `<div class="qa-section-title">面接での対応例</div>` : ''}
      ${(item.qa||[]).map(qa=>`
        <div class="qa-pair"><button type="button" class="qa-q">${esc(qa.q)}</button><div class="qa-wrap"><div class="qa-inner"><div class="a">${esc(qa.a)}</div></div></div></div>
      `).join('')}
    </div>
  `).join('')}
  ${(s.generalQA && s.generalQA.length) ? `
    <div class="card">
      <h3>面接での対応例（全般）</h3>
      ${s.generalQA.map(qa=>`
        <div class="qa-pair"><button type="button" class="qa-q">${esc(qa.q)}</button><div class="qa-wrap"><div class="qa-inner"><div class="a">${esc(qa.a)}</div></div></div></div>
      `).join('')}
    </div>
  ` : ''}
  `;
}

function renderDesiredConditions(text){
  if(!text) return '<p class="body"><span class="muted">未入力</span></p>';
  const lines = text.split('\n').filter(Boolean);
  return lines.map(line=>{
    const m = line.match(/^【(.+?)】(.*)$/);
    if(!m) return `<div class="dc-row"><div class="dc-chips"><span class="dc-chip">${esc(line)}</span></div></div>`;
    const label = m[1];
    const rest = m[2];
    const parts = rest.split('／').map(p=>p.trim()).filter(Boolean);
    const chips = parts.map(p=>{
      const pm = p.match(/^(第[一二三四五]志望)[:：](.*)$/);
      if(pm){
        const rankClass = pm[1]==='第一志望' ? 'rank-1' : pm[1]==='第二志望' ? 'rank-2' : 'rank-3';
        return `<span class="dc-chip ${rankClass}"><b>${esc(pm[1])}</b>${esc(pm[2])}</span>`;
      }
      return `<span class="dc-chip">${esc(p)}</span>`;
    }).join('');
    return `<div class="dc-row"><div class="dc-label">${esc(label)}</div><div class="dc-chips">${chips}</div></div>`;
  }).join('');
}
function renderResearch(){
  const r = data.research || {};
  if(!r.title && !r.overview){
    return `<div class="section-head"><h1>研究</h1><p>研究テーマや内容</p></div><div class="empty">まだ登録なし</div>`;
  }
  return `
  <div class="section-head"><h1>研究</h1><p>研究テーマ・内容・意義</p></div>
  <div class="card"><h3>${esc(r.title) || '研究テーマ'}</h3></div>
  <div class="card"><h3>研究概要</h3><p class="body">${nl2br(r.overview)}</p></div>
  <div class="card"><h3>研究の意義</h3><p class="body">${nl2br(r.significance)}</p></div>
  <div class="card"><h3>研究を選んだ理由</h3><p class="body">${nl2br(r.reason)}</p></div>
  <div class="card"><h3>研究から学んだこと</h3><p class="body">${nl2br(r.learned)}</p></div>
  `;
}
function renderIndustry(){
  const s = data.self || {};
  const list = data.industries || [];
  return `
  <div class="section-head"><h1>志望業界</h1><p>興味のある業界と志望条件</p></div>
  <div class="card"><h3>志望条件まとめ</h3>${renderDesiredConditions(s.desiredConditions)}</div>
  ${list.length===0 ? '' : list.map(i=>`
    <div class="card"><h3>${esc(i.name)}</h3><p class="body">${nl2br(i.note)}</p></div>
  `).join('')}
  `;
}

const STATUS_LABEL = {};
const COL_DEFS = [
  {key:'name', label:'企業名', type:'text'},
  {key:'industry', label:'業界', type:'text'},
  {key:'location', label:'勤務地', type:'text'},
  {key:'salaryStart', label:'院卒初任給(月給/円)', type:'num'},
  {key:'annualSalary', label:'平均年収(万円)', type:'num'},
  {key:'avgAge', label:'平均年齢(歳)', type:'num'},
  {key:'holidays', label:'年間休日(日)', type:'num'},
  {key:'holidayDetail', label:'休日内訳', type:'text'},
  {key:'status', label:'選考状況', type:'text'},
  {key:'memo', label:'メモ', type:'text'},
];

function renderCompany(){
  let list = [...(data.companies||[])];
  list.sort((a,b)=>{
    const def = COL_DEFS.find(c=>c.key===sort.key);
    let va = a[sort.key], vb = b[sort.key];
    if(def && def.type==='num'){ va = Number(va)||0; vb = Number(vb)||0; return sort.dir==='asc' ? va-vb : vb-va; }
    va = (va||'').toString(); vb = (vb||'').toString();
    return sort.dir==='asc' ? va.localeCompare(vb,'ja') : vb.localeCompare(va,'ja');
  });
  const rows = list.map(c=>`
    <tr>
      <td>${c.careerUrl ? `<a class="company-link" href="${esc(c.careerUrl)}" target="_blank" rel="noopener">${esc(c.name)}</a>` : esc(c.name)}</td>
      <td>${esc(c.industry)}</td>
      <td>${esc(c.location)}</td>
      <td>${c.salaryStart ? Number(c.salaryStart).toLocaleString() : ''}</td>
      <td>${c.annualSalary ? Number(c.annualSalary).toLocaleString() : ''}</td>
      <td>${c.avgAge || ''}</td>
      <td>${c.holidays || ''}</td>
      <td>${esc(c.holidayDetail)}</td>
      <td>${statusPill(c.status)}</td>
      <td>${esc(c.memo)}</td>
    </tr>
  `).join('');
  return `
  <div class="section-head"><h1>企業一覧</h1><p>列名クリックで並び替え。企業名リンクは各社の採用ページへ</p></div>
  <div class="table-wrap"><table>
    <thead><tr>
      ${COL_DEFS.map(c=>`<th data-sort="${c.key}">${c.label}${sort.key===c.key ? `<span class="arrow">${sort.dir==='asc'?'▲':'▼'}</span>`:''}</th>`).join('')}
    </tr></thead>
    <tbody>${rows || `<tr><td colspan="10"><div class="empty">まだ企業が登録されてない</div></td></tr>`}</tbody>
  </table></div>
  `;
}
function statusPill(status){
  let cls = ''; if(status==='内定') cls='offer'; if(status==='不合格' || status==='辞退') cls='reject';
  return `<span class="status-pill ${cls}">${esc(status||'未応募')}</span>`;
}
function setSort(key){
  if(sort.key===key) sort.dir = sort.dir==='asc' ? 'desc' : 'asc'; else { sort.key = key; sort.dir = 'asc'; }
  render();
}

function renderIntern(){
  const list = data.interns || [];
  const mypages = (data.companies||[]).filter(c=>c.mypageUrl);
  return `
  <div class="section-head"><h1>インターン</h1><p>参加したインターンの内容と学び</p></div>
  ${list.length===0 ? '<div class="empty">まだ登録なし</div>' : list.map(i=>`
    <div class="card">
      <h3>${esc(i.company)} <span class="muted" style="font-weight:400; font-size:13px;">${esc(i.period)}${i.date?' ／ '+esc(i.date):''}</span></h3>
      <p class="body"><strong>内容：</strong>${nl2br(i.content)}</p>
      <p class="body"><strong>学び：</strong>${nl2br(i.learning)}</p>
    </div>
  `).join('')}

  <h3 style="font-size:16px; font-weight:700; color:var(--ink); margin-top:30px; letter-spacing:-0.01em;">マイページ一覧</h3>
  ${mypages.length===0 ? '<div class="empty">登録済みのマイページはまだなし</div>' : `
  <div class="table-wrap">
    <table>
      <thead><tr><th>企業名</th><th>選考状況</th><th>マイページ</th></tr></thead>
      <tbody>
        ${mypages.map(c=>`
          <tr>
            <td>${esc(c.name)}</td>
            <td>${statusPill(c.status)}</td>
            <td><a class="company-link" href="${esc(c.mypageUrl)}" target="_blank" rel="noopener">ログインページへ</a></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  </div>`}
  `;
}

function renderSkill(){
  const quals = data.quals || [];
  const acts = data.activities || [];
  return `
  <div class="section-head"><h1>資格・経験</h1><p>資格と活動経験</p></div>
  <h3 style="font-size:16px; font-weight:700; color:var(--ink); letter-spacing:-0.01em;">資格</h3>
  ${quals.length===0 ? '<div class="empty">まだ登録なし</div>' : `
  <div class="table-wrap" style="margin-bottom:26px;"><table>
    <thead><tr><th>資格名</th><th>取得日</th><th>メモ</th></tr></thead>
    <tbody>${quals.map(q=>`<tr><td>${esc(q.name)}</td><td>${esc(q.date)}</td><td>${esc(q.note)}</td></tr>`).join('')}</tbody>
  </table></div>`}
  <h3 style="font-size:16px; font-weight:700; color:var(--ink); margin-top:24px; letter-spacing:-0.01em;">やったこと・活動経験</h3>
  ${acts.length===0 ? '<div class="empty">まだ登録なし</div>' : acts.map(a=>`
    <div class="card"><h3>${esc(a.title)} <span class="muted" style="font-weight:400; font-size:13px;">${esc(a.date)}</span></h3><p class="body">${nl2br(a.content)}</p></div>
  `).join('')}
  `;
}

function pad(n){ return n.toString().padStart(2,'0'); }
function collectEvents(){
  const evts = [];
  (data.interns||[]).forEach(i=>{ if(i.date) evts.push({date:i.date, label:`${i.company} インターン`, type:'intern'}); });
  return evts;
}
function renderCalendar(){
  const evts = collectEvents();
  const y = calState.year, m = calState.month;
  const first = new Date(y, m, 1);
  const startOffset = first.getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const todayStr = new Date().toISOString().slice(0,10);
  const dow = ['日','月','火','水','木','金','土'];
  let cells = '';
  for(let i=0;i<startOffset;i++) cells += `<div class="cal-cell blank"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${y}-${pad(m+1)}-${pad(d)}`;
    const dayEvts = evts.filter(e=>e.date===dateStr);
    cells += `<div class="cal-cell ${dateStr===todayStr?'today':''}"><div class="daynum">${d}</div>${dayEvts.map(e=>`<div class="cal-evt ${e.type}">${esc(e.label)}</div>`).join('')}</div>`;
  }
  return `
  <div class="section-head"><h1>カレンダー</h1><p>インターンの開始日をまとめて表示</p></div>
  <div class="cal-head">
    <button class="cal-nav" data-shift="-1">← 前月</button>
    <h2>${y}年 ${m+1}月</h2>
    <button class="cal-nav" data-shift="1">次月 →</button>
  </div>
  <div class="cal-legend">
    <span><i style="background:var(--accent-lime);"></i>インターン</span>
  </div>
  <div class="cal-grid">${dow.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div>
  ${evts.length===0 ? '<div class="empty" style="margin-top:16px;">まだ予定なし</div>' : ''}
  `;
}
function shiftMonth(diff){
  calState.month += diff;
  if(calState.month<0){ calState.month=11; calState.year--; }
  if(calState.month>11){ calState.month=0; calState.year++; }
  render();
}

init();
</script>
</body>
</html>
