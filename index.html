<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="就活ノート">
<meta name="theme-color" content="#333a42">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%232f4159'/%3E%3Ctext x='50' y='63' font-size='46' text-anchor='middle' fill='white' font-family='sans-serif'%3E就%3C/text%3E%3C/svg%3E">
<title>就活ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#333a42;
    --paper:#faf7f0;
    --paper-line:#e4ded0;
    --ink:#24211d;
    --ink-soft:#686253;
    --primary:#2f4159;
    --primary-soft:#4d5f78;
    --accent:#b8862e;
    --danger:#a63d40;
    --good:#3f6b4a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    font-family:"Noto Sans JP",sans-serif;
    color:var(--ink);
    min-height:100vh;
  }
  h1,h2,h3{font-family:"Noto Serif JP",serif; margin:0 0 .4em 0; font-weight:700;}
  .app{
    display:flex;
    min-height:100vh;
  }
  /* サイドバー：ノートのインデックスタブ風 */
  .sidebar{
    width:180px;
    flex-shrink:0;
    padding:28px 0 28px 18px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .sidebar .brand{
    color:#f2ede0;
    font-family:"Noto Serif JP",serif;
    font-size:19px;
    font-weight:700;
    padding:0 8px 20px 6px;
    line-height:1.5;
    border-bottom:1px solid #4a515a;
    margin-bottom:8px;
  }
  .tab-btn{
    text-align:left;
    border:none;
    cursor:pointer;
    padding:13px 16px;
    font-family:"Noto Sans JP",sans-serif;
    font-size:14.5px;
    font-weight:500;
    color:#d8d3c4;
    background:transparent;
    border-radius:8px 0 0 8px;
    transition:background .15s, color .15s;
    letter-spacing:.02em;
  }
  .tab-btn:hover{background:#3d4550; color:#fff;}
  .tab-btn.active{
    background:var(--paper);
    color:var(--primary);
    font-weight:700;
  }
  .main{
    flex:1;
    background:var(--paper);
    background-image: repeating-linear-gradient(to bottom, transparent 0 38px, var(--paper-line) 38px 39px);
    padding:36px 44px 60px;
    min-width:0;
  }
  .section-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:22px;
    flex-wrap:wrap;
    gap:10px;
  }
  .section-head p{margin:2px 0 0; color:var(--ink-soft); font-size:13.5px;}
  .card{
    background:#fff;
    border:1px solid var(--paper-line);
    border-radius:4px;
    padding:20px 22px;
    margin-bottom:18px;
    box-shadow:0 1px 0 rgba(0,0,0,.03);
  }
  .card h3{font-size:15.5px; color:var(--primary);}
  label{
    display:block;
    font-size:12.5px;
    color:var(--ink-soft);
    margin:10px 0 4px;
    font-weight:500;
  }
  textarea, input[type=text], input[type=number], input[type=url], input[type=date], select{
    width:100%;
    font-family:"Noto Sans JP",sans-serif;
    font-size:14px;
    padding:8px 10px;
    border:1px solid #d6d0c1;
    border-radius:4px;
    background:#fffdf9;
    color:var(--ink);
  }
  textarea{resize:vertical; min-height:70px; line-height:1.6;}
  input:focus, textarea:focus, select:focus{outline:2px solid var(--primary-soft); outline-offset:1px;}
  .btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    border:none;
    cursor:pointer;
    font-family:"Noto Sans JP",sans-serif;
    font-size:13.5px;
    font-weight:700;
    padding:8px 16px;
    border-radius:4px;
    background:var(--primary);
    color:#fff;
    transition:background .15s;
  }
  .btn:hover{background:var(--primary-soft);}
  .btn.ghost{background:transparent; color:var(--primary); border:1px solid var(--primary); font-weight:500;}
  .btn.ghost:hover{background:#eef1f5;}
  .btn.danger{background:transparent; color:var(--danger); font-weight:500; padding:6px 10px;}
  .btn.danger:hover{background:#fbeceb;}
  .btn.small{padding:5px 10px; font-size:12.5px;}
  .row{display:flex; gap:14px; flex-wrap:wrap;}
  .row > div{flex:1; min-width:160px;}
  .item-block{
    border:1px solid var(--paper-line);
    border-radius:4px;
    padding:16px 18px;
    margin-bottom:14px;
    background:#fffdf9;
    position:relative;
  }
  .item-block-head{
    display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:6px;
  }
  .qa-pair{
    border-left:3px solid var(--accent);
    padding:6px 0 6px 12px;
    margin:8px 0;
  }
  .qa-pair .q{font-weight:700; font-size:13.5px; color:var(--primary);}
  .qa-pair .a{font-size:13.5px; color:var(--ink); margin-top:2px; white-space:pre-wrap;}
  .muted{color:var(--ink-soft); font-size:13px;}
  table{
    width:100%;
    border-collapse:collapse;
    font-size:13.5px;
    background:#fff;
  }
  thead th{
    text-align:left;
    padding:9px 10px;
    background:var(--primary);
    color:#fff;
    font-weight:500;
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
    position:relative;
  }
  thead th:hover{background:var(--primary-soft);}
  thead th .arrow{font-size:11px; margin-left:3px; opacity:.85;}
  tbody td{
    padding:9px 10px;
    border-bottom:1px solid var(--paper-line);
    vertical-align:top;
  }
  tbody tr:hover{background:#f8f5ee;}
  .table-wrap{overflow-x:auto; border:1px solid var(--paper-line); border-radius:4px;}
  .company-link{color:var(--primary); font-weight:700; text-decoration:none; border-bottom:1px solid var(--primary-soft);}
  .company-link:hover{color:var(--accent); border-color:var(--accent);}
  .status-pill{
    display:inline-block;
    padding:2px 9px;
    border-radius:20px;
    font-size:12px;
    font-weight:700;
    background:#eef1f5;
    color:var(--primary);
    white-space:nowrap;
  }
  .status-pill.offer{background:#eef4ee; color:var(--good);}
  .status-pill.reject{background:#fbeceb; color:var(--danger);}
  .toolbar{display:flex; justify-content:flex-end; margin-bottom:12px; gap:10px;}
  .empty{
    text-align:center;
    color:var(--ink-soft);
    padding:30px 10px;
    border:1px dashed var(--paper-line);
    border-radius:4px;
    font-size:13.5px;
  }
  .save-msg{font-size:12px; color:var(--good); margin-left:8px; opacity:0; transition:opacity .3s;}
  .save-msg.show{opacity:1;}
  form.inline-form{display:none;}
  form.inline-form.open{display:block;}
  .cal-head{display:flex; align-items:center; gap:14px; margin-bottom:16px;}
  .cal-head h2{font-family:"Noto Serif JP",serif; color:var(--primary); font-size:20px; min-width:130px;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); border:1px solid var(--paper-line); background:var(--paper-line); gap:1px;}
  .cal-dow{background:var(--primary); color:#fff; text-align:center; padding:6px 0; font-size:12.5px; font-weight:700;}
  .cal-cell{background:#fff; min-height:88px; padding:5px 6px; font-size:12px;}
  .cal-cell.blank{background:#f4f1ea;}
  .cal-cell .daynum{font-weight:700; color:var(--ink-soft); font-size:12px;}
  .cal-cell.today .daynum{color:#fff; background:var(--accent); border-radius:50%; display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px;}
  .cal-evt{margin-top:3px; padding:2px 5px; border-radius:3px; font-size:11px; line-height:1.4; color:#fff; word-break:break-all;}
  .cal-evt.deadline{background:var(--danger);}
  .cal-evt.interview{background:var(--primary);}
  .cal-evt.intern{background:var(--good);}
  .cal-legend{display:flex; gap:16px; margin:14px 0 6px; font-size:12.5px; color:var(--ink-soft); align-items:center;}
  .cal-legend span{display:inline-flex; align-items:center; gap:5px;}
  .cal-legend i{width:10px; height:10px; border-radius:2px; display:inline-block;}
  @media (max-width:760px){
    .app{flex-direction:column;}
    .sidebar{
      width:100%;
      flex-direction:row;
      overflow-x:auto;
      padding:14px 12px;
      gap:6px;
    }
    .sidebar .brand{display:none;}
    .tab-btn{border-radius:6px; white-space:nowrap;}
    .main{padding:22px 16px 50px;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="brand">就活ノート</div>
    <button class="tab-btn active" data-tab="self">自己分析</button>
    <button class="tab-btn" data-tab="industry">志望業界</button>
    <button class="tab-btn" data-tab="company">企業一覧</button>
    <button class="tab-btn" data-tab="intern">インターン</button>
    <button class="tab-btn" data-tab="skill">資格・経験</button>
    <button class="tab-btn" data-tab="calendar">カレンダー</button>
  </div>
  <div class="main" id="main">
    <div class="empty">読み込み中…</div>
  </div>
</div>

<script>
/* ---------- storage helpers (Cloudflare Pages Functions経由でGitHubのdata.jsonに保存) ---------- */
let _cache = null;
async function _loadCache(){
  if(_cache) return _cache;
  try{
    const r = await fetch('/api/data', { cache:'no-store' });
    _cache = await r.json();
  }catch(e){ _cache = {}; }
  return _cache;
}
async function _saveCache(){
  try{
    const r = await fetch('/api/data', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(_cache)
    });
    return r.ok;
  }catch(e){ console.error('storage save failed', e); return false; }
}
async function sGet(key, fallback){
  const c = await _loadCache();
  const k = key.replace('jobhunt:','');
  return (c[k] !== undefined && c[k] !== null) ? c[k] : fallback;
}
async function sSet(key, value){
  const c = await _loadCache();
  const k = key.replace('jobhunt:','');
  c[k] = value;
  return await _saveCache();
}
function uid(){ return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(str){
  return (str ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function nl2br(str){ return esc(str).replace(/\n/g,'<br>'); }

/* ---------- state ---------- */
const state = {
  self: { strengths:'', weaknesses:'', pr:'', vision:'', education:'', desiredConditions:'', gakuchika:[] },
  industries: [],
  companies: [],
  interns: [],
  quals: [],
  activities: []
};
let currentTab = 'self';
let sort = { key:'name', dir:'asc' };

/* ---------- 会話で教えてもらった内容をここに追記していく ----------
   Claudeがチャットで聞いた内容を、ここにidを振って追加 → ファイルを渡すと、
   ブラウザ側で既に保存されてる内容とマージされる（idが同じものは上書きしない＝
   ユーザーが編集/削除した内容を尊重する）。 */
const SEED = {
  self: {
    strengths:'', weaknesses:'',
    pr: '私は【チームでの成果】を重視し、【技術と顧客の両方】に向き合う【ジェネラリスト】志向のエンジニアを目指しています。高校からのアメフトや4年間の飲食店アルバイトでは、攻守両方やホールと厨房など複数の役割を経験し、多角的な視点からチームの課題改善に貢献しました。また、事前の備えを大切にする性格から早期に基本情報技術者試験に合格し、独学でプログラミング言語を学び、必要な知識を持ったうえでAIを駆使し、院対策Webアプリや在室管理アプリなども開発しました。これらを友人に提供して喜ばれた経験から、技術で直接ユーザーの課題を解決する面白さを学びました。将来的には、システムエンジニアとして個人の技術力を高めつつ、顧客の声を直接聞きながらチーム全体でより良いシステムを作り上げる人材になりたいです。制作したアプリなどは、連携済みのGitHubアカウントからご確認いただけます。',
    vision: 'やってみたいことは、ユーザーの潜在的な課題を汲み取り、技術の力で解決するシステムの企画から開発までを一貫して担うことです。独学でのアプリ開発や、飲食店で接客と厨房の双方の視点を持った経験を通じて、作り手と使い手、両方の目線を持つことの重要性を学びました。入社後は、資格取得や個人開発で培ったITの基礎知識を活かしつつ、まずは開発現場で技術力を深めたいです。ゆくゆくは、顧客と直接向き合ってニーズを引き出し、多様な役割を横断するユーティリティ性を活かして、チーム全体でより良いシステムを作り上げるエンジニアとして貢献したいと考えております。',
    education: '大阪公立大学 工学部 電気電子システム工学科（2023/04〜2027/03）\n宮崎研究室（2026/04〜2029/03、大学院進学予定）\n大阪府立池田高等学校（2020/04〜2023/03）',
    desiredConditions: '【志望業種】第一志望：ソフトウェア・情報処理／第二志望：インターネット関連・Web／第三志望：ゲーム（情報・サービス）\n【志望職種】第一志望：ソフトウェアエンジニア／第二志望：システムエンジニア（SE）／第三志望：AIエンジニア\n【志望勤務地】第一志望：大阪府／第二志望：広島県／第三志望：兵庫県\n【就職先に求めること】年収が高い／知名度がある／福利厚生が充実している\n【志望企業規模】大手企業（社員数2,000人〜）',
    gakuchika:[]
  },
  industries: [],
  companies: [
    { id:'seed-panasonic', name:'パナソニックグループ', industry:'機械／ソフトウェア・情報処理／電気・電子機器／半導体・電子部品／家電・AV機器', mypageUrl:'', salaryStart:'', annualSalary:'', avgAge:'', holidays:'', holidayDetail:'', status:'未応募', esDeadline:'', interviewDate:'', memo:'従業員数207,548人' },
    { id:'seed-capcom', name:'カプコン', industry:'ゲーム（情報・サービス）／ソフトウェア', mypageUrl:'', salaryStart:'300000', annualSalary:'919', avgAge:'38', holidays:'121', holidayDetail:'完全週休2日制（土日）＋祝日、有給消化率73.3%', status:'未応募', esDeadline:'', interviewDate:'', memo:'大阪本社。学歴・職種問わず初任給一律30万円。月平均残業11.4時間、自己都合離職率2.2%（2025年3月期・有価証券報告書ベース）' }
  ],
  interns: [],
  quals: [
    { id:'seed-toeic', name:'TOEIC', date:'', note:'795点' },
    { id:'seed-kihon', name:'基本情報技術者試験', date:'', note:'取得' },
    { id:'seed-itpass', name:'ITパスポート', date:'', note:'取得' }
  ],
  activities: []
};

function mergeList(key, seedArr){
  const existing = new Set(state[key].map(x=>x.id));
  (seedArr||[]).forEach(item=>{ if(!existing.has(item.id)) state[key].push(item); });
}
async function mergeSeed(){
  let changed = false;
  ['strengths','weaknesses','pr','vision','education','desiredConditions'].forEach(f=>{
    if(SEED.self[f] && !state.self[f]){ state.self[f] = SEED.self[f]; changed = true; }
  });
  const existingGIds = new Set((state.self.gakuchika||[]).map(g=>g.id));
  (SEED.self.gakuchika||[]).forEach(g=>{ if(!existingGIds.has(g.id)){ state.self.gakuchika.push(g); changed = true; } });
  ['industries','companies','interns','quals','activities'].forEach(key=>{
    const before = state[key].length;
    mergeList(key, SEED[key]);
    if(state[key].length !== before) changed = true;
  });
  if(changed){
    await Promise.all([
      sSet('jobhunt:self', state.self),
      sSet('jobhunt:industries', state.industries),
      sSet('jobhunt:companies', state.companies),
      sSet('jobhunt:interns', state.interns),
      sSet('jobhunt:quals', state.quals),
      sSet('jobhunt:activities', state.activities),
    ]);
  }
}

/* ---------- init ---------- */
async function init(){
  const [self, industries, companies, interns, quals, activities] = await Promise.all([
    sGet('jobhunt:self', { strengths:'', weaknesses:'', pr:'', vision:'', education:'', desiredConditions:'', gakuchika:[] }),
    sGet('jobhunt:industries', []),
    sGet('jobhunt:companies', []),
    sGet('jobhunt:interns', []),
    sGet('jobhunt:quals', []),
    sGet('jobhunt:activities', [])
  ]);
  state.self = self; state.industries = industries; state.companies = companies;
  state.interns = interns; state.quals = quals; state.activities = activities;
  await mergeSeed();
  render();
}

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    render();
  });
});

function render(){
  const main = document.getElementById('main');
  if(currentTab==='self') main.innerHTML = renderSelf();
  else if(currentTab==='industry') main.innerHTML = renderIndustry();
  else if(currentTab==='company') main.innerHTML = renderCompany();
  else if(currentTab==='intern') main.innerHTML = renderIntern();
  else if(currentTab==='skill') main.innerHTML = renderSkill();
  else if(currentTab==='calendar') main.innerHTML = renderCalendar();
  bindEvents();
}

function flashSave(){
  const el = document.getElementById('save-msg');
  if(!el) return;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 1200);
}

/* ================= 自己分析 ================= */
function renderSelf(){
  const g = state.self.gakuchika || [];
  return `
  <div class="section-head">
    <div><h1>自己分析</h1><p>強み・弱みとガクチカ、面接で聞かれやすい質問への回答をまとめる</p></div>
    <span class="save-msg" id="save-msg">保存したで</span>
  </div>
  <div class="card">
    <h3>自己PR・学歴</h3>
    <label>自己PR（自己紹介文）</label>
    <textarea id="pr" style="min-height:130px;" placeholder="企業に伝えたい強みや自己紹介">${esc(state.self.pr)}</textarea>
    <label>学歴</label>
    <textarea id="education" style="min-height:70px;" placeholder="大学・学部・学科・研究室・高校など">${esc(state.self.education)}</textarea>
    <label>強み</label>
    <textarea id="strengths" placeholder="例：地道な検証を続けられる、チームで役割分担して動ける、など">${esc(state.self.strengths)}</textarea>
    <label>弱み</label>
    <textarea id="weaknesses" placeholder="例：完璧主義で抱え込みがち、初対面だと緊張しやすい、など">${esc(state.self.weaknesses)}</textarea>
    <label>これからやってみたいこと</label>
    <textarea id="vision" style="min-height:100px;" placeholder="興味のあることと、それを仕事にどう活かしたいか">${esc(state.self.vision)}</textarea>
    <div style="margin-top:12px;"><button class="btn" onclick="saveBasics()">保存</button></div>
  </div>

  <div class="section-head" style="margin-top:26px;">
    <h3 style="font-family:'Noto Serif JP',serif; font-size:16px; color:var(--primary);">ガクチカ</h3>
    <button class="btn ghost small" onclick="addGakuchika()">＋ ガクチカを追加</button>
  </div>
  ${g.length===0 ? '<div class="empty">まだガクチカが登録されてへん。「＋ガクチカを追加」から作ってな</div>' : ''}
  ${g.map(item=>renderGakuchikaCard(item)).join('')}
  `;
}

function renderGakuchikaCard(item){
  const qas = item.qa || [];
  return `
  <div class="card" data-gid="${item.id}">
    <div class="item-block-head">
      <input type="text" class="g-title" value="${esc(item.title)}" placeholder="タイトル（例：〇〇サークルでの△△）" style="font-weight:700; font-size:15px; border:none; background:transparent; padding:0;">
      <button class="btn danger small" onclick="deleteGakuchika('${item.id}')">削除</button>
    </div>
    <label>内容（ガクチカ本文）</label>
    <textarea class="g-content" style="min-height:110px;" placeholder="状況・課題・行動・結果の流れで書く">${esc(item.content)}</textarea>

    <div style="margin-top:14px; display:flex; justify-content:space-between; align-items:center;">

/* ================= カレンダー ================= */
const calState = { year: new Date().getFullYear(), month: new Date().getMonth() };
function pad(n){ return n.toString().padStart(2,'0'); }
function collectEvents(){
  const evts = [];
  (state.companies||[]).forEach(c=>{
    if(c.esDeadline) evts.push({date:c.esDeadline, label:`${c.name} ES締切`, type:'deadline'});
    if(c.interviewDate) evts.push({date:c.interviewDate, label:`${c.name} 面接`, type:'interview'});
  });
  (state.interns||[]).forEach(i=>{
    if(i.date) evts.push({date:i.date, label:`${i.company} インターン`, type:'intern'});
  });
  return evts;
}
function renderCalendar(){
  const evts = collectEvents();
  const y = calState.year, m = calState.month;
  const first = new Date(y, m, 1);
  const startOffset = first.getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const todayStr = new Date().toISOString().slice(0,10);
  const dow = ['日','月','火','水','木','金','土'];

  let cells = '';
  for(let i=0;i<startOffset;i++) cells += `<div class="cal-cell blank"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${y}-${pad(m+1)}-${pad(d)}`;
    const dayEvts = evts.filter(e=>e.date===dateStr);
    cells += `<div class="cal-cell ${dateStr===todayStr?'today':''}">
      <div class="daynum">${d}</div>
      ${dayEvts.map(e=>`<div class="cal-evt ${e.type}">${esc(e.label)}</div>`).join('')}
    </div>`;
  }

  return `
  <div class="section-head">
    <div><h1>カレンダー</h1><p>企業一覧のES締切・面接日程、インターン開始日を自動でまとめて表示する</p></div>
  </div>
  <div class="cal-head">
    <button class="btn ghost small" onclick="shiftMonth(-1)">← 前月</button>
    <h2>${y}年 ${m+1}月</h2>
    <button class="btn ghost small" onclick="shiftMonth(1)">次月 →</button>
    <button class="btn ghost small" onclick="goToday()">今月</button>
  </div>
  <div class="cal-legend">
    <span><i style="background:var(--danger);"></i>ES締切</span>
    <span><i style="background:var(--primary);"></i>面接</span>
    <span><i style="background:var(--good);"></i>インターン</span>
  </div>
  <div class="cal-grid">
    ${dow.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
    ${cells}
  </div>
  ${evts.length===0 ? '<div class="empty" style="margin-top:16px;">企業一覧でES締切・面接日程を入力するか、インターンで開始日を入力すると、ここに表示されるで</div>' : ''}
  `;
}
function shiftMonth(diff){
  calState.month += diff;
  if(calState.month<0){ calState.month=11; calState.year--; }
  if(calState.month>11){ calState.month=0; calState.year++; }
  render();
}
function goToday(){
  const n = new Date();
  calState.year = n.getFullYear(); calState.month = n.getMonth();
  render();
}

function bindEvents(){ /* placeholder for future delegated events */ }

init();
</script>
</body>
</html>
