<title>就活ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#333a42; --paper:#faf7f0; --paper-line:#e4ded0; --ink:#24211d; --ink-soft:#686253;
    --primary:#2f4159; --primary-soft:#4d5f78; --accent:#b8862e; --danger:#a63d40; --good:#3f6b4a;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); font-family:"Noto Sans JP",sans-serif; color:var(--ink); min-height:100vh;}
  h1,h2,h3{font-family:"Noto Serif JP",serif; margin:0 0 .4em 0; font-weight:700;}
  .app{display:flex; min-height:100vh;}
  .sidebar{width:180px; flex-shrink:0; padding:28px 0 28px 18px; display:flex; flex-direction:column; gap:10px;}
  .sidebar .brand{color:#f2ede0; font-family:"Noto Serif JP",serif; font-size:19px; font-weight:700; padding:0 8px 16px 6px; line-height:1.5; border-bottom:1px solid #4a515a; margin-bottom:8px;}
  .sidebar .updated{color:#a9a396; font-size:11px; padding:0 8px 16px 6px;}
  .tab-btn{text-align:left; border:none; cursor:pointer; padding:13px 16px; font-family:"Noto Sans JP",sans-serif; font-size:14.5px; font-weight:500; color:#d8d3c4; background:transparent; border-radius:8px 0 0 8px;}
  .tab-btn:hover{background:#3d4550; color:#fff;}
  .tab-btn.active{background:var(--paper); color:var(--primary); font-weight:700;}
  .main{flex:1; background:var(--paper); background-image:repeating-linear-gradient(to bottom, transparent 0 38px, var(--paper-line) 38px 39px); padding:36px 44px 60px; min-width:0;}
  .section-head{margin-bottom:22px;}
  .section-head p{margin:2px 0 0; color:var(--ink-soft); font-size:13.5px;}
  .card{background:#fff; border:1px solid var(--paper-line); border-radius:4px; padding:20px 22px; margin-bottom:18px;}
  .card h3{font-size:15.5px; color:var(--primary);}
  .card .body{white-space:pre-wrap; font-size:14px; line-height:1.7; margin:0;}
  .muted{color:var(--ink-soft); font-size:13px;}
  table{width:100%; border-collapse:collapse; font-size:13.5px; background:#fff;}
  thead th{text-align:left; padding:9px 10px; background:var(--primary); color:#fff; font-weight:500; cursor:pointer; user-select:none; white-space:nowrap;}
  thead th:hover{background:var(--primary-soft);}
  thead th .arrow{font-size:11px; margin-left:3px; opacity:.85;}
  tbody td{padding:9px 10px; border-bottom:1px solid var(--paper-line); vertical-align:top; white-space:nowrap;}
  tbody tr:hover{background:#f8f5ee;}
  .table-wrap{overflow-x:auto; border:1px solid var(--paper-line); border-radius:4px;}
  .company-link{color:var(--primary); font-weight:700; text-decoration:none; border-bottom:1px solid var(--primary-soft);}
  .status-pill{display:inline-block; padding:2px 9px; border-radius:20px; font-size:12px; font-weight:700; background:#eef1f5; color:var(--primary); white-space:nowrap;}
  .status-pill.offer{background:#eef4ee; color:var(--good);}
  .status-pill.reject{background:#fbeceb; color:var(--danger);}
  .empty{text-align:center; color:var(--ink-soft); padding:30px 10px; border:1px dashed var(--paper-line); border-radius:4px; font-size:13.5px;}
  .qa-pair{border-left:3px solid var(--accent); padding:6px 0 6px 12px; margin:8px 0;}
  .qa-pair .q{font-weight:700; font-size:13.5px; color:var(--primary);}
  .qa-pair .a{font-size:13.5px; color:var(--ink); margin-top:2px; white-space:pre-wrap;}
  .cal-head{display:flex; align-items:center; gap:14px; margin-bottom:16px;}
  .cal-head h2{font-family:"Noto Serif JP",serif; color:var(--primary); font-size:20px; min-width:130px;}
  .cal-nav{background:none; border:1px solid var(--primary); color:var(--primary); border-radius:4px; padding:6px 12px; cursor:pointer; font-size:13px;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); border:1px solid var(--paper-line); background:var(--paper-line); gap:1px;}
  .cal-dow{background:var(--primary); color:#fff; text-align:center; padding:6px 0; font-size:12.5px; font-weight:700;}
  .cal-cell{background:#fff; min-height:88px; padding:5px 6px; font-size:12px;}
  .cal-cell.blank{background:#f4f1ea;}
  .cal-cell .daynum{font-weight:700; color:var(--ink-soft); font-size:12px;}
  .cal-cell.today .daynum{color:#fff; background:var(--accent); border-radius:50%; display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px;}
  .cal-evt{margin-top:3px; padding:2px 5px; border-radius:3px; font-size:11px; line-height:1.4; color:#fff; word-break:break-all;}
  .cal-evt.deadline{background:var(--danger);} .cal-evt.interview{background:var(--primary);} .cal-evt.intern{background:var(--good);}
  .cal-legend{display:flex; gap:16px; margin:14px 0 6px; font-size:12.5px; color:var(--ink-soft); align-items:center;}
  .cal-legend span{display:inline-flex; align-items:center; gap:5px;}
  .cal-legend i{width:10px; height:10px; border-radius:2px; display:inline-block;}
  .dc-row{margin-bottom:16px;}
  .dc-row:last-child{margin-bottom:0;}
  .dc-label{font-family:'Noto Serif JP',serif; font-weight:700; color:var(--primary); font-size:13px; margin-bottom:8px; padding-left:10px; border-left:3px solid var(--accent);}
  .dc-chips{display:flex; flex-wrap:wrap; gap:8px;}
  .dc-chip{background:#fff; border:1px solid var(--paper-line); border-radius:20px; padding:6px 14px; font-size:13px; color:var(--ink); white-space:nowrap;}
  .dc-chip b{color:var(--primary); margin-right:5px; font-weight:700;}
  .dc-chip.rank-1{border-color:var(--accent); background:#fdf6ea;}
  .dc-chip.rank-1 b{color:var(--accent);}
  .dc-chip.rank-2{border-color:var(--primary-soft);}
  .dc-chip.rank-3{border-color:var(--paper-line); opacity:.85;}
  @media (max-width:760px){
    .app{flex-direction:column;}
    .sidebar{width:100%; flex-direction:row; overflow-x:auto; padding:14px 12px; gap:6px;}
    .sidebar .brand, .sidebar .updated{display:none;}
    .tab-btn{border-radius:6px; white-space:nowrap;}
    .main{padding:22px 16px 50px;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="brand">就活ノート</div>
    <div class="updated" id="updated"></div>
    <button class="tab-btn active" data-tab="self">自己分析</button>
    <button class="tab-btn" data-tab="industry">志望業界</button>
    <button class="tab-btn" data-tab="company">企業一覧</button>
    <button class="tab-btn" data-tab="intern">インターン</button>
    <button class="tab-btn" data-tab="skill">資格・経験</button>
    <button class="tab-btn" data-tab="calendar">カレンダー</button>
  </div>
  <div class="main" id="main"><div class="empty">読み込み中…</div></div>
</div>
<script>
function esc(str){ return (str ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function nl2br(str){ return esc(str).replace(/\n/g,'<br>'); }

let data = { self:{}, industries:[], companies:[], interns:[], quals:[], activities:[] };
let currentTab = 'self';
let sort = { key:'name', dir:'asc' };
const calState = { year:new Date().getFullYear(), month:new Date().getMonth() };

async function init(){
  try{
    const r = await fetch('./data.json?t=' + Date.now(), { cache:'no-store' });
    data = await r.json();
    if(data.updatedAt) document.getElementById('updated').textContent = '最終更新: ' + data.updatedAt;
  }catch(e){
    document.getElementById('main').innerHTML = '<div class="empty">データの読み込みに失敗した。少し待ってから再読み込みしてみて</div>';
    return;
  }
  render();
}

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    render();
  });
});

function render(){
  const main = document.getElementById('main');
  if(currentTab==='self') main.innerHTML = renderSelf();
  else if(currentTab==='industry') main.innerHTML = renderIndustry();
  else if(currentTab==='company') main.innerHTML = renderCompany();
  else if(currentTab==='intern') main.innerHTML = renderIntern();
  else if(currentTab==='skill') main.innerHTML = renderSkill();
  else if(currentTab==='calendar') main.innerHTML = renderCalendar();
  document.querySelectorAll('th[data-sort]').forEach(th=>{
    th.addEventListener('click', ()=>{ setSort(th.dataset.sort); });
  });
  document.querySelectorAll('.cal-nav').forEach(btn=>{
    btn.addEventListener('click', ()=>{ shiftMonth(parseInt(btn.dataset.shift)); });
  });
}

function renderSelf(){
  const s = data.self || {};
  const g = s.gakuchika || [];
  return `
  <div class="section-head"><h1>自己分析</h1><p>強み・弱み・自己PR・学歴・ガクチカ</p></div>
  <div class="card"><h3>自己PR</h3><p class="body">${s.pr ? nl2br(s.pr) : '<span class="muted">未入力</span>'}</p></div>
  <div class="card"><h3>学歴</h3><p class="body">${s.education ? nl2br(s.education) : '<span class="muted">未入力</span>'}</p></div>
  <div class="card"><h3>強み</h3><p class="body">${s.strengths ? nl2br(s.strengths) : '<span class="muted">未入力</span>'}</p></div>
  <div class="card"><h3>弱み</h3><p class="body">${s.weaknesses ? nl2br(s.weaknesses) : '<span class="muted">未入力</span>'}</p></div>
  <div class="card"><h3>これからやってみたいこと</h3><p class="body">${s.vision ? nl2br(s.vision) : '<span class="muted">未入力</span>'}</p></div>
  <h3 style="font-family:'Noto Serif JP',serif; font-size:16px; color:var(--primary); margin-top:26px;">ガクチカ</h3>
  ${g.length===0 ? '<div class="empty">まだ登録なし</div>' : g.map(item=>`
    <div class="card">
      <h3>${esc(item.title) || '（無題）'}</h3>
      <p class="body">${nl2br(item.content)}</p>
      ${(item.qa||[]).map(qa=>`
        <div class="qa-pair"><div class="q">${esc(qa.q)}</div><div class="a">${esc(qa.a)}</div></div>
      `).join('')}
    </div>
  `).join('')}
  `;
}

function renderDesiredConditions(text){
  if(!text) return '<p class="body"><span class="muted">未入力</span></p>';
  const lines = text.split('\n').filter(Boolean);
  return lines.map(line=>{
    const m = line.match(/^【(.+?)】(.*)$/);
    if(!m) return `<div class="dc-row"><div class="dc-chips"><span class="dc-chip">${esc(line)}</span></div></div>`;
    const label = m[1];
    const rest = m[2];
    const parts = rest.split('／').map(p=>p.trim()).filter(Boolean);
    const chips = parts.map(p=>{
      const pm = p.match(/^(第[一二三四五]志望)[:：](.*)$/);
      if(pm){
        const rankClass = pm[1]==='第一志望' ? 'rank-1' : pm[1]==='第二志望' ? 'rank-2' : 'rank-3';
        return `<span class="dc-chip ${rankClass}"><b>${esc(pm[1])}</b>${esc(pm[2])}</span>`;
      }
      return `<span class="dc-chip">${esc(p)}</span>`;
    }).join('');
    return `<div class="dc-row"><div class="dc-label">${esc(label)}</div><div class="dc-chips">${chips}</div></div>`;
  }).join('');
}
function renderIndustry(){
  const s = data.self || {};
  const list = data.industries || [];
  return `
  <div class="section-head"><h1>志望業界</h1><p>興味のある業界と志望条件</p></div>
  <div class="card"><h3>志望条件まとめ</h3>${renderDesiredConditions(s.desiredConditions)}</div>
  ${list.length===0 ? '' : list.map(i=>`
    <div class="card"><h3>${esc(i.name)}</h3><p class="body">${nl2br(i.note)}</p></div>
  `).join('')}
  `;
}

const STATUS_LABEL = {};
const COL_DEFS = [
  {key:'name', label:'企業名', type:'text'},
  {key:'industry', label:'業界', type:'text'},
  {key:'salaryStart', label:'院卒初任給(月給/円)', type:'num'},
  {key:'annualSalary', label:'平均年収(万円)', type:'num'},
  {key:'avgAge', label:'平均年齢(歳)', type:'num'},
  {key:'holidays', label:'年間休日(日)', type:'num'},
  {key:'holidayDetail', label:'休日内訳', type:'text'},
  {key:'status', label:'選考状況', type:'text'},
  {key:'esDeadline', label:'ES締切', type:'text'},
  {key:'interviewDate', label:'次の面接日程', type:'text'},
  {key:'memo', label:'メモ', type:'text'},
];

function renderCompany(){
  let list = [...(data.companies||[])];
  list.sort((a,b)=>{
    const def = COL_DEFS.find(c=>c.key===sort.key);
    let va = a[sort.key], vb = b[sort.key];
    if(def && def.type==='num'){ va = Number(va)||0; vb = Number(vb)||0; return sort.dir==='asc' ? va-vb : vb-va; }
    va = (va||'').toString(); vb = (vb||'').toString();
    return sort.dir==='asc' ? va.localeCompare(vb,'ja') : vb.localeCompare(va,'ja');
  });
  const rows = list.map(c=>`
    <tr>
      <td>${c.mypageUrl ? `<a class="company-link" href="${esc(c.mypageUrl)}" target="_blank" rel="noopener">${esc(c.name)}</a>` : esc(c.name)}</td>
      <td>${esc(c.industry)}</td>
      <td>${c.salaryStart ? Number(c.salaryStart).toLocaleString() : ''}</td>
      <td>${c.annualSalary ? Number(c.annualSalary).toLocaleString() : ''}</td>
      <td>${c.avgAge || ''}</td>
      <td>${c.holidays || ''}</td>
      <td>${esc(c.holidayDetail)}</td>
      <td>${statusPill(c.status)}</td>
      <td>${esc(c.esDeadline)}</td>
      <td>${esc(c.interviewDate)}</td>
      <td>${esc(c.memo)}</td>
    </tr>
  `).join('');
  return `
  <div class="section-head"><h1>企業一覧</h1><p>列名クリックで並び替え。企業名リンクはマイページへ</p></div>
  <div class="table-wrap"><table>
    <thead><tr>
      ${COL_DEFS.map(c=>`<th data-sort="${c.key}">${c.label}${sort.key===c.key ? `<span class="arrow">${sort.dir==='asc'?'▲':'▼'}</span>`:''}</th>`).join('')}
    </tr></thead>
    <tbody>${rows || `<tr><td colspan="11"><div class="empty">まだ企業が登録されてない</div></td></tr>`}</tbody>
  </table></div>
  `;
}
function statusPill(status){
  let cls = ''; if(status==='内定') cls='offer'; if(status==='不合格' || status==='辞退') cls='reject';
  return `<span class="status-pill ${cls}">${esc(status||'未応募')}</span>`;
}
function setSort(key){
  if(sort.key===key) sort.dir = sort.dir==='asc' ? 'desc' : 'asc'; else { sort.key = key; sort.dir = 'asc'; }
  render();
}

function renderIntern(){
  const list = data.interns || [];
  return `
  <div class="section-head"><h1>インターン</h1><p>参加したインターンの内容と学び</p></div>
  ${list.length===0 ? '<div class="empty">まだ登録なし</div>' : list.map(i=>`
    <div class="card">
      <h3>${esc(i.company)} <span class="muted" style="font-weight:400; font-size:13px;">${esc(i.period)}${i.date?' ／ '+esc(i.date):''}</span></h3>
      <p class="body"><strong>内容：</strong>${nl2br(i.content)}</p>
      <p class="body"><strong>学び：</strong>${nl2br(i.learning)}</p>
    </div>
  `).join('')}
  `;
}

function renderSkill(){
  const quals = data.quals || [];
  const acts = data.activities || [];
  return `
  <div class="section-head"><h1>資格・経験</h1><p>資格と活動経験</p></div>
  <h3 style="font-family:'Noto Serif JP',serif; font-size:16px; color:var(--primary);">資格</h3>
  ${quals.length===0 ? '<div class="empty">まだ登録なし</div>' : `
  <div class="table-wrap" style="margin-bottom:26px;"><table>
    <thead><tr><th>資格名</th><th>取得日</th><th>メモ</th></tr></thead>
    <tbody>${quals.map(q=>`<tr><td>${esc(q.name)}</td><td>${esc(q.date)}</td><td>${esc(q.note)}</td></tr>`).join('')}</tbody>
  </table></div>`}
  <h3 style="font-family:'Noto Serif JP',serif; font-size:16px; color:var(--primary); margin-top:20px;">やったこと・活動経験</h3>
  ${acts.length===0 ? '<div class="empty">まだ登録なし</div>' : acts.map(a=>`
    <div class="card"><h3>${esc(a.title)} <span class="muted" style="font-weight:400; font-size:13px;">${esc(a.date)}</span></h3><p class="body">${nl2br(a.content)}</p></div>
  `).join('')}
  `;
}

function pad(n){ return n.toString().padStart(2,'0'); }
function collectEvents(){
  const evts = [];
  (data.companies||[]).forEach(c=>{
    if(c.esDeadline) evts.push({date:c.esDeadline, label:`${c.name} ES締切`, type:'deadline'});
    if(c.interviewDate) evts.push({date:c.interviewDate, label:`${c.name} 面接`, type:'interview'});
  });
  (data.interns||[]).forEach(i=>{ if(i.date) evts.push({date:i.date, label:`${i.company} インターン`, type:'intern'}); });
  return evts;
}
function renderCalendar(){
  const evts = collectEvents();
  const y = calState.year, m = calState.month;
  const first = new Date(y, m, 1);
  const startOffset = first.getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const todayStr = new Date().toISOString().slice(0,10);
  const dow = ['日','月','火','水','木','金','土'];
  let cells = '';
  for(let i=0;i<startOffset;i++) cells += `<div class="cal-cell blank"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${y}-${pad(m+1)}-${pad(d)}`;
    const dayEvts = evts.filter(e=>e.date===dateStr);
    cells += `<div class="cal-cell ${dateStr===todayStr?'today':''}"><div class="daynum">${d}</div>${dayEvts.map(e=>`<div class="cal-evt ${e.type}">${esc(e.label)}</div>`).join('')}</div>`;
  }
  return `
  <div class="section-head"><h1>カレンダー</h1><p>ES締切・面接日程・インターン開始日</p></div>
  <div class="cal-head">
    <button class="cal-nav" data-shift="-1">← 前月</button>
    <h2>${y}年 ${m+1}月</h2>
    <button class="cal-nav" data-shift="1">次月 →</button>
  </div>
  <div class="cal-legend">
    <span><i style="background:var(--danger);"></i>ES締切</span>
    <span><i style="background:var(--primary);"></i>面接</span>
    <span><i style="background:var(--good);"></i>インターン</span>
  </div>
  <div class="cal-grid">${dow.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div>
  ${evts.length===0 ? '<div class="empty" style="margin-top:16px;">まだ予定なし</div>' : ''}
  `;
}
function shiftMonth(diff){
  calState.month += diff;
  if(calState.month<0){ calState.month=11; calState.year--; }
  if(calState.month>11){ calState.month=0; calState.year++; }
  render();
}

init();
</script>

</html>
